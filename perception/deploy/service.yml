perception:
  image: __IMAGE__
  container_name: embodied-perception
  # The L4T base image ships zero-length placeholders for the driver libraries
  # (/usr/lib/aarch64-linux-gnu/nvidia/libcuda.so.1 and friends); only the nvidia
  # runtime bind-mounts the host's real ones over them. Under the default runc
  # runtime the placeholders stay, so `import tensorrt` dies on
  # libnvdla_compiler.so and torch.cuda.is_available() is False — i.e. no GPU at
  # all for OCR, VOP or VITS2 TTS, whatever privileged and /dev:/dev suggest.
  # Same flag the adam driver uses.
  #
  # Do not read a libnvdla_compiler.so error as proof that this flag is missing:
  # a host BSP without nvidia-l4t-dla-compiler produces the identical message
  # with the runtime working correctly. The image carries a fallback for exactly
  # that case and logs "[dla-fallback] host BSP has no libnvdla_compiler.so" when
  # it uses it — see the dla-fallback step in Dockerfile.jetson.
  runtime: nvidia
  network_mode: host
  ipc: host
  pid: host
  privileged: true
  volumes:
    - /dev:/dev
    - /opt/embodied/models:/models
    # Shared image drop-off, mounted at the same path by agent-core (see
    # agent-core/deploy/docker-compose.yml). This is how a photo reaches this
    # container: the canvas file picker uploads through agent-core's
    # /api/file/upload, and the LLM writes downloads here — both land on the
    # host directory, and perception reads the same path back. Without a shared
    # mount there is *no* path both containers can name: agent-core's /tmp and
    # /work are its own, and a base64 argument is not a workable substitute
    # (a 40 000-character string does not survive an LLM's context).
    - /opt/embodied/uploads:/uploads
    # DDS profile 只读挂载。必须与其它 DDS 容器加载同一份，
    # 否则本容器会与本机其余部分失联。
    - /opt/phanthy-motus/dds-local.xml:/opt/phanthy-motus/dds-local.xml:ro
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/phanthy-motus/dds-local.xml
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped
