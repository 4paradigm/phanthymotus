perception:
  image: __IMAGE__
  container_name: embodied-perception
  depends_on:
    nav2:
      condition: service_started
  network_mode: host
  ipc: host
  pid: host
  privileged: true
  volumes:
    - /dev:/dev
    - /opt/embodied/models:/models
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

nav2:
  image: ${NAV2_IMAGE:-phanthy-nav2:nav2-card-dev}
  container_name: embodied-perception-nav2
  network_mode: host
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m
    - /root/.ros:rw,nosuid,nodev,noexec,size=64m
  volumes:
    - /opt/phanthy-motus/data/nav2/maps:/maps
  group_add:
    - "${NAV2_MAP_GID:-1000}"
  environment:
    - ROS_DOMAIN_ID=42
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    - NAV2_MODE=${NAV2_MODE:-mapping}
    - NAV2_MAP_NAME=${NAV2_MAP_NAME:-}
    - NAV2_LIDAR_X=${NAV2_LIDAR_X:--0.00368}
    - NAV2_LIDAR_Y=${NAV2_LIDAR_Y:-0.00003}
    - NAV2_LIDAR_Z=${NAV2_LIDAR_Z:-0.46018}
    - NAV2_LIDAR_ROLL=${NAV2_LIDAR_ROLL:-0.0}
    - NAV2_LIDAR_PITCH=${NAV2_LIDAR_PITCH:-0.04014257279586953}
    - NAV2_LIDAR_YAW=${NAV2_LIDAR_YAW:-0.0}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped
  command:
    - /bin/bash
    - -lc
    - >-
      source /opt/ros/humble/setup.bash &&
      source /nav2_ws/install/setup.bash &&
      exec ros2 run g1_nav2 runtime_supervisor
