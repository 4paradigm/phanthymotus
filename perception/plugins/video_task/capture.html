<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>示范采集</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#35322e;background:#fbf9f5;font-size:14px}*{box-sizing:border-box}body{margin:0}main{padding:26px 28px 95px;max-width:1100px;margin:auto}h1{font-size:29px;margin:4px 0 8px;letter-spacing:-.5px}h2{font-size:17px;margin:0 0 12px}.note{color:#827b71;font-size:13px;line-height:1.6}.eyebrow{font-size:12px;color:#9b7760}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.timer{font:500 27px ui-monospace,monospace;color:#a74f29}.layout{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:14px}.view{position:relative;overflow:hidden;border:1px solid #e5ddd2;border-radius:12px;background:#eee8df;min-height:240px;display:flex;align-items:center;justify-content:center}.view img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0;background:#272522}.view .label{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:6px;background:#fff9;max-width:90%;overflow-wrap:anywhere;z-index:1}.view.stale img{opacity:.4}.placeholder{padding:30px;text-align:center;color:#8b8276;line-height:1.8}.aside{display:grid;gap:14px;align-content:start}.aside .view{min-height:150px}.panel{padding:18px;border:1px solid #e5ddd2;border-radius:12px;background:#fffdf9;min-width:0}.signal{font-size:12px;color:#827b71;overflow-wrap:anywhere}.signal strong{display:block;font-size:22px;color:#3b3732;font-weight:500;margin:6px 0}canvas{width:100%;height:50px;display:block}.strip{margin-top:16px;padding:12px 15px;border-radius:8px;background:#f0ebe3;line-height:1.6}.strip.warning{color:#9e512e;background:#f8eade}details{margin-top:16px;border:1px solid #e5ddd2;border-radius:8px;padding:14px}summary{cursor:pointer;font-weight:550}label{display:block;margin-top:12px;color:#736b60;font-size:12px}input,select{font:inherit;color:#39352f;border:1px solid #ded6ca;border-radius:6px;padding:8px;background:#fffdf9;max-width:100%;width:100%;margin-top:5px}.source-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:end;margin:8px 0}.source-row p{overflow-wrap:anywhere;margin:0}.source-row label{margin:0}button{font:inherit;border:1px solid #ded6ca;border-radius:7px;background:#fffdf9;padding:10px 17px;cursor:pointer;color:#544a3d}button:disabled{opacity:.45;cursor:default}button.primary{background:#a64e29;border-color:#a64e29;color:white;font-weight:600;min-width:170px}button.quiet{background:transparent;border-color:transparent;padding-left:0;padding-right:0}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #ad5c36;outline-offset:3px}footer{position:fixed;bottom:0;left:0;right:0;background:#fbf9f5f5;border-top:1px solid #e5ddd2;padding:14px 28px;display:flex;gap:15px;align-items:center}.grow{flex:1}.hidden{display:none!important}.record-row{padding:12px 0;border-bottom:1px solid #e5ddd2}.record-row p{margin:5px 0}.error{color:#a73724}#status{font-size:12px;line-height:1.5}#recent{margin-top:24px}#setupSave{margin-top:8px}@media(max-width:600px){main{padding:18px 15px 130px}.layout{grid-template-columns:1fr}.view{min-height:240px}.aside{grid-template-columns:1fr 1fr}.aside .view{min-height:120px}.panel{padding:12px}h1{font-size:24px}footer{padding:12px 15px;flex-wrap:wrap}footer .grow{min-width:90px}.timer{font-size:21px}.source-row{grid-template-columns:minmax(0,1fr) 95px}}
</style>
<main>
 <header><div><div class="eyebrow">现场示范</div><h1 id="heading">记录一次示范</h1><div class="note" id="connection">正在读取采集状态…</div></div><div id="timer" class="timer hidden" aria-live="off">00:00</div></header>
 <div class="layout"><div class="view" id="mainView"><div class="placeholder">把相机连到这张卡片<br>点击开启预览，即可开始录制</div></div><div class="aside"><div id="auxView" class="view"><div class="placeholder">辅助视角可选</div></div><div id="thirdView" class="view hidden"></div><div class="panel"><h2>动作状态</h2><div id="signals" class="note">接入关节或夹爪状态后显示<br>也可以只录制视频</div></div></div></div>
 <div class="strip" id="guidance">画面与动作将保存到“示范学习”，关闭页面不影响录制。</div>
 <details id="setup"><summary>可选设置 · 视角与名称</summary><p class="note">沿用画布上已连接的来源，无需填写话题。相机最多3路，状态最多4路；接收采样上限为相机10Hz、状态30Hz。按本机接收时间对齐，不代表硬件同步。</p><div id="sourceSettings"></div><label>示范名称（可选）<input id="demoName" maxlength="100" placeholder="例如：取下杯盖"></label><button id="setupSave" class="quiet">保存视角设置</button><button id="previewStop" class="quiet hidden">关闭采集预览</button><p class="note">单次最多120秒／256MiB。UMI原始相机可作为视频来源；本卡不恢复SLAM轨迹，处理后的UMI／EgoDex文件仍在示范学习中导入。</p></details>
 <section id="recent" class="hidden"><h2>最近录制</h2><div id="recentRows"></div></section>
</main>
<footer><button id="recentToggle" class="quiet">最近录制</button><button id="mark" class="quiet hidden">标记人工干预</button><div class="grow"><div id="status" role="status"></div></div><button id="primary" class="primary" disabled>等待相机连接</button></footer>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), pending=new Map(), history=new Map();
let port,seq=0,state=null,inputs=[],inflight=false,polling=false,setupKey='',recentKey='',stopped=false;
const roleNames={external:'外部视角',ego:'第一视角',wrist:'腕部视角',other:'其他视角'};
function host(method,args={}){return new Promise((resolve,reject)=>{if(!port)return reject(Error('尚未连接'));const id=String(++seq),timeout=setTimeout(()=>{pending.delete(id);reject(Error('请求超时，请检查状态后重试'));},20000);pending.set(id,{resolve,reject,timeout});port.postMessage({id,method,args});});}
function rpc(action,args={}){return host('call',{action,...args});}
function message(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function view(container,source){let img=container.querySelector('img'),label=container.querySelector('.label');if(!source){container.replaceChildren();const p=document.createElement('div');p.className='placeholder';p.textContent=container.id==='mainView'?(inputs.some(t=>t.format==='image/jpeg')?'相机已连好，点击下方开启预览':'把相机连到这张卡片，即可开启预览'):'辅助视角可选';container.append(p);return;}if(!img){container.replaceChildren();img=document.createElement('img');img.alt='现场相机画面';label=document.createElement('span');label.className='label';container.append(img,label);}if(source.preview)img.src=source.preview;else img.removeAttribute('src');container.classList.toggle('stale',!source.fresh||!!source.error);label.textContent=source.name+' · '+(roleNames[source.role]||'')+(source.fresh&&!source.error?' · 已接入':' · 数据中断');}
function spark(canvas,values){const ctx=canvas.getContext('2d');canvas.width=300;canvas.height=65;ctx.clearRect(0,0,300,65);if(values.length<2)return;const lo=Math.min(...values),hi=Math.max(...values),span=hi-lo||1;ctx.strokeStyle='#a64e29';ctx.lineWidth=2;ctx.beginPath();values.forEach((v,i)=>{const x=300*i/(values.length-1),y=55-45*(v-lo)/span;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
function render(next){state=next;const session=state.session,recording=session?.state==='recording',processing=session?.state==='processing',videos=state.sources.filter(s=>s.kind==='video'),numeric=state.sources.filter(s=>s.kind!=='video'),fresh=state.sources.length&&state.sources.every(s=>s.fresh&&!s.error),done=session?.state==='done';
 $('heading').textContent=recording?'正在记录示范':processing?'正在整理示范':done?'示范已保存':'记录一次示范';$('connection').textContent=state.sources.length?'已连接 '+videos.length+' 路画面 · '+numeric.length+' 路状态':inputs.length?'已沿用画布上的 '+inputs.length+' 路来源':'只需把相机连到这张卡片';
 $('timer').classList.toggle('hidden',!recording&&!processing);const seconds=Math.floor(session?.elapsed_s||0);$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 view($('mainView'),videos[0]);view($('auxView'),videos[1]);$('thirdView').classList.toggle('hidden',!videos[2]);if(videos[2])view($('thirdView'),videos[2]);
 $('signals').replaceChildren();let shown=0;for(const source of numeric){for(const [key,value] of Object.entries(source.values||{}).sort((a,b)=>Number(/gripper|width/.test(b[0]))-Number(/gripper|width/.test(a[0]))).slice(0,2)){if(shown++>=1)break;const id=source.topic+key,values=history.get(id)||[];if(source.fresh){values.push(value);if(values.length>40)values.shift();history.set(id,values);}const box=document.createElement('div'),title=document.createElement('span'),number=document.createElement('strong'),canvas=document.createElement('canvas');box.className='signal';title.textContent=key;number.textContent=(source.fresh?Number(value.toPrecision(5)):'—')+' · 源数值';box.append(title,number,canvas);$('signals').append(box);spark(canvas,values);}}
 if(!shown)$('signals').textContent='尚无数值状态；可以只录制视频';
 const gaps=state.sources.filter(s=>!s.fresh||s.error),warning=gaps.length&&state.sources.length;
 $('guidance').classList.toggle('warning',!!warning||!!session?.error);
 $('guidance').textContent=session?.error?session.error:warning?'来源中断：'+gaps.map(s=>s.name+(s.error?'（'+s.error+'）':'')).join('、')+'。录制中的缺失会保留。':done?'已加入“示范学习”的视频列表：'+session.name+'。关闭此页，打开原工作台即可回看和分析。':recording?'正在保存画面和动作。结束后自动加入示范学习；关闭页面不会停止录制。':processing?'正在编码录像并保存动作证据，可以关闭页面，稍后在原工作台查看。':'画面与动作将保存到“示范学习”；按本机接收时间对齐。';
 const needsPreview=state.state==='idle',hasCamera=inputs.some(t=>t.format==='image/jpeg');
 $('primary').textContent=needsPreview?(hasCamera?'开启采集预览':'请先连接相机'):recording?'结束并保存':processing?'正在保存…':done?'录制下一段':fresh?'开始录制':'等待有效来源';$('primary').disabled=inflight||processing||(needsPreview?!hasCamera:!recording&&!fresh);$('previewStop').classList.toggle('hidden',needsPreview);$('previewStop').disabled=recording||processing||inflight;$('mark').classList.toggle('hidden',!recording);$('mark').disabled=inflight;$('setupSave').disabled=recording||processing||inflight;$('demoName').disabled=recording||processing;
 const key=JSON.stringify(state.sources.map(s=>[s.topic,s.role,s.name]));if(key!==setupKey){setupKey=key;$('sourceSettings').replaceChildren();for(const source of state.sources.filter(s=>s.kind==='video')){const row=document.createElement('div'),p=document.createElement('p'),select=document.createElement('select');row.className='source-row';p.className='note';p.textContent=source.name;p.title=source.topic;select.dataset.topic=source.topic;select.dataset.name=source.name;select.setAttribute('aria-label',source.topic+' 视角');for(const [value,label] of Object.entries(roleNames)){const option=document.createElement('option');option.value=value;option.textContent=label;select.append(option);}select.value=source.role;select.disabled=source.kind!=='video';row.append(p,select);$('sourceSettings').append(row);}}
 const rkey=JSON.stringify(state.recent);if(rkey!==recentKey){recentKey=rkey;$('recentRows').replaceChildren();for(const item of state.recent){const row=document.createElement('div'),name=document.createElement('strong'),p=document.createElement('p');row.className='record-row';name.textContent=item.name;p.className='note';p.textContent=({done:'已加入示范学习',recording:'正在录制',processing:'正在整理',interrupted:'上次录制中断',failed:'整理失败'}[item.state]||item.state)+(item.error?' · '+item.error:'');row.append(name,p);if(['failed','interrupted'].includes(item.state)){const b=document.createElement('button');b.textContent='重试整理';b.onclick=()=>act('retry',{capture_id:item.id});row.append(b);}$('recentRows').append(row);}if(!state.recent.length)$('recentRows').textContent='还没有录制记录';}
}
async function refresh(){if(polling||stopped)return;polling=true;try{const [next,context]=await Promise.all([rpc('info'),host('inputs').catch(()=>({inputs:[]}))]);inputs=context.inputs;render(next);}catch(e){message('状态读取失败：'+e.message,true);$('primary').disabled=true;}finally{polling=false;}}
async function act(action,args={}){if(inflight)return;inflight=true;$('primary').disabled=true;try{const result=await rpc(action,args);if(result.error)throw Error(result.error);message(action==='mark'?'已保存人工干预标记':action==='start'?'预览已开启，收到画面后即可录制':'操作已保存');await refresh();}catch(e){message(e.message,true);}finally{inflight=false;if(state)render(state);}}
 $('primary').onclick=()=>state?.state==='idle'?act('start'):act(state?.session?.state==='recording'?'record_stop':'record_start',{name:$('demoName').value});$('previewStop').onclick=()=>act('stop');$('mark').onclick=()=>act('mark',{label:'人工干预'});$('recentToggle').onclick=()=>$('recent').classList.toggle('hidden');
 $('setupSave').onclick=()=>act('configure',{sources:[...$('sourceSettings').querySelectorAll('select')].map(s=>({topic:s.dataset.topic,role:s.value,name:s.dataset.name}))});
 window.addEventListener('message',event=>{if(event.source!==parent||event.data?.protocol!=='motus.workbench/1'||!event.ports[0]||port)return;port=event.ports[0];port.onmessage=({data})=>{const p=pending.get(data.id);if(!p)return;pending.delete(data.id);clearTimeout(p.timeout);data.error?p.reject(Error(data.error)):p.resolve(data.result);};refresh();});
 const timer=setInterval(refresh,1000);window.addEventListener('pagehide',()=>{stopped=true;clearInterval(timer);port?.close();});
})();
</script></html>
