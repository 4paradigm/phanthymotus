services:
  nav2:
    image: ${NAV2_IMAGE:?stage-six Nav2 image is required}
    container_name: nav2-card-stage6-companion
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
      - /root/.ros:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - nav2_stage6_maps:/maps
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      NAV2_MODE: mapping
      NAV2_MAP_NAME: ""
      NAV2_LIDAR_X: "-0.00368"
      NAV2_LIDAR_Y: "0.00003"
      NAV2_LIDAR_Z: "0.46018"
      NAV2_LIDAR_ROLL: "0.0"
      NAV2_LIDAR_PITCH: "0.04014257279586953"
      NAV2_LIDAR_YAW: "0.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  perception:
    image: ${NAV2_IMAGE:?stage-six Nav2 image is required}
    container_name: nav2-card-stage6-perception
    depends_on:
      - nav2
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /root/.ros:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ../../..:/work:ro
    environment:
      AGENT_CORE_URL: https://127.0.0.1:15678
      CONFIG_PATH: /work/plugins/nav2/integration/config.stage6.yaml
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    command:
      - /bin/bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        exec python3 /work/main.py
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  fixture:
    image: ${NAV2_IMAGE:?stage-six Nav2 image is required}
    network_mode: host
    profiles:
      - fixture
    volumes:
      - ../../..:/work:ro
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
      NAV2_FIXTURE_SENSOR_SCHEMA: ${NAV2_FIXTURE_SENSOR_SCHEMA:-legacy}
    command:
      - /bin/bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        exec python3 /work/tests/nav2_stage6_fixture.py
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  nav2_stage6_maps:
