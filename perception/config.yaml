mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    backend: tensorrt
    fallback_backend: mnn
    url: ""
    key: ""
    model: ""
    model_dir: /models/ocr/ppocrv6-small-trt-jp6-trt10.4-orin-batch8-cls8
    fallback_model_dir: /models/ocr/ppocrv6-small-mnn
    device: cuda
    device_id: 0
    language: zh
    use_angle_cls: true
    num_threads: 1
    # v2 最优配置（GT-centric macro F1 0.6847，2026-07-30 调参定稿）：
    #   1600 / unclip0.7 / rec_min0.9。回滚点：9de44b7（960/unclip1.2/rec_min0.3）。
    #   rec_min0.9 是最大杠杆(+8.4pp)：TP rec_score 中位1.0、FP 0.79，砍FP几乎不伤TP。
    #   注意：此为 v2(waic/上海公区小字) 调优值；v1(菜单/海报) 偏好更低分辨率，见 docs。
    max_side_len: 1600
    det_unclip_ratio: 0.7
    det_thresh: 0.3
    det_box_thresh: 0.5
    rec_min_score: 0.9          # v2 最优：TP置信度~1.0 / FP~0.79，抬到0.9砍FP +8.4pp
    crop_refinement:
      # 仅对低于 rec_min_score 的 TensorRT 框做三种保守子框复识别；新结果必须
      # 同时达到 min_score 且比原框高 min_gain，避免全局低阈值重新引入 FP。
      enabled: true
      min_score: 0.9
      min_gain: 0.12
      min_text_length: 2
      profiles: [prefix_65, upper_center, upper_tight]
    min_interval_ms: 0
    large_image_strategy:
      # 关闭分块：tile 跨边界切割产生无法去重的碎片框, predict_T 膨胀 77%, F1 崩塌
      enabled: false
      trigger_side: 2400
      decode_side: 3200
      decode_hard_limit: 4096
      tile_size: 1280
      overlap: 128
      max_tiles: 12
      global_pass: true
      dedup_iou: 0.5
      dedup_text_similarity: 0.8
