mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
      pre_roll_ms: 500
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    model_dir: /models/ocr/ppocrv6-small-trt
    device_id: 0
    language: zh
    use_angle_cls: true
    max_side_len: 1600
    det_unclip_ratio: 0.7
    det_thresh: 0.3
    det_box_thresh: 0.5
    rec_min_score: 0.9
    crop_refinement:
      enabled: true
      min_score: 0.9
      min_gain: 0.12
      min_text_length: 2
      profiles: [prefix_65, upper_center, upper_tight]
    empty_result_retry:
      enabled: true
      det_thresh: 0.1
      det_box_thresh: 0.1
    min_interval_ms: 0

  obstacle:
    enabled: true
    provider: local
    # Select the deployment domain explicitly; OBSTACLE_FIXED_SCENE overrides it.
    scene_mode: fixed
    fixed_scene: indoor
    model_dir: /models/obstacle/zipdepth-int8
    decision_threshold_m: 2.0
    fallback_distance_m: 3.0
    soft_timeout_s: 2.5
    indoor:
      roi: [0, 300, 213, 426]
      roi_reference_size: [480, 640]
      inverse_depth_percentile: 95.0
      score_threshold: -0.06
      # Convert the ZipDepth inverse-depth ROI statistic to a bounded distance.
      inverse_depth_distance_scale: -27.0
      inverse_depth_distance_bias_m: 3.7
      classification_margin_m: 0.001
      min_output_distance_m: 0.0
      max_output_distance_m: 10.0
      min_valid_pixels: 64
    vehicle:
      allowed_classes: [person, car, truck, bus, motorcycle, bicycle]
      min_confidence: 0.25
      percentile: 1.0
      min_depth_m: 0.3
      max_depth_m: 80.0
      camera_to_bumper_offset_m: 1.0
      allow_approximate_geometry: true
      # Apply affine calibration after approximate bumper-offset geometry.
      distance_calibration:
        mode: affine
        scale: 1.2
        bias: -2.4
        min_output_m: 0.0
        max_output_m: 80.0
      calibration: {}
