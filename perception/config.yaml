mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  navigation:
    enabled: true
    namespace: ubuntu
    mapping:
      backend: ros_topic
      request_timeout_sec: 130.0
      discovery_timeout_sec: 5.0
      input_max_age_ms: 500
      map_voxel_size_m: 0.10
      collection_enabled: false
      collection_directory: /opt/phanthy-motus/data/fast_livo2/recordings
    planning:
      backend: ros_topic
      shadow_only: true
      request_timeout_sec: 30.0
      discovery_timeout_sec: 5.0
      input_max_age_ms: 500
      min_x_mps: 0.30
      max_x_mps: 1.0
      min_y_mps: 0.0
      max_y_mps: 0.0
      min_yaw_rps: 1.0
      max_yaw_rps: 2.0
      proposal_ttl_ms: 250
    semantic:
      camera_topic: "/ubuntu/camera/rgb"
      odometry_topic: "/ubuntu/navigation/odom"
      fast_livo2_status_topic: "/ubuntu/navigation/fast_livo2/status"
      goal_topic: "/ubuntu/navigation/goal_pose"
      required_frame_id: "map"
      required_child_frame_id: "base_link"
      sensor_timeout_sec: 2.5
      sensor_max_age_sec: 1.0
      sensor_max_skew_sec: 0.35
      sensor_sync_mode: "receive_time"
      status_restart_gap_sec: 5.0
      status_stale_after_sec: 3.5
      subscriber_timeout_sec: 2.0
      match_threshold: 0.55
      navigation_speed: 0.30
      auto_start_on_action: true
