mcp_port: 15720

plugins:
  asr:
    enabled: true
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  stereo:
    enabled: true
    matcher: "sgbm"     # sgbm (OpenCV, CPU) — future deep-learning matchers plug in here
    fps: 5
    sync_ms: 50         # max left/right timestamp difference (ms) to accept a pair
    max_points: 40000   # max points per published cloud
    max_depth: 0        # meters, 0 = no limit (only meaningful with calibration)
    # Stereo calibration (from cv2.stereoRectify). All 0 = synthetic intrinsics:
    # cloud shape is correct but absolute scale is arbitrary.
    fx: 0               # focal length in pixels
    baseline: 0         # baseline in meters
    cx: 0               # principal point x (0 = image center)
    cy: 0               # principal point y (0 = image center)
    sgbm:
      min_disparity: 16
      num_disparities: 144   # must be a multiple of 16; larger = closer objects, slower
      block_size: 5
