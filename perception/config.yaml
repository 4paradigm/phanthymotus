mcp_port: 15720

plugins:
  asr:
    enabled: true
    # Matches the configSchema default. SenseVoice on CPU is also the faster of
    # the two int8 options (RTF 14.2x vs 9.1x for streaming paraformer) and has
    # the largest gpu upside (fp16).
    asr_model: sensevoice-small   # x-asr-zh-en | paraformer-zh-en | paraformer-offline | zipformer-en | sensevoice-small
    # cpu | gpu — which weights get loaded is per (model, device) in
    # plugins/asr.py ASR_MODELS. gpu needs the CUDA sherpa-onnx wheel (jetson
    # jp5.11 only) and is only offered for models where it was benchmarked and
    # the transcripts were read: sensevoice-small (fp16) and paraformer-zh-en
    # (fp32). Everything else is cpu-only — int8 weights are slower on CUDA, not
    # faster, because ONNX Runtime's CUDA provider has no int8 kernels.
    #
    # gpu is ~3.4x faster per utterance (58 ms vs 195 ms p50 on 1-4 s of speech)
    # and costs ~2 GB RAM against ~0.5 GB on cpu, ~1.4 GB of it a CUDA context
    # the process never returns. On a 7.4 GB Orin already running vop + OCR +
    # TTS that is enough to run the box out of memory, so cpu is the default
    # even on images that could use the GPU. Numbers in utils/onnx_provider.py.
    device: cpu
    num_threads: 2   # cpu only; 4 buys ~1.2-1.5x. Ignored on gpu.
    # Decode 1 s of silence after the model loads. On gpu the first inference
    # costs ~1.7 s (lazy kernels, cuDNN autotune, memory pool) against a 58 ms
    # steady state; without this the operator pays it on their first utterance.
    warmup: true
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx | silero (same silero_vad.onnx, via sherpa-onnx) | webrtc
      threshold: 0.5
      silence_ms: 400
      pre_roll_ms: 500
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    engine: vits2_trt
    backend: trt
    model_dir: /models/vits2
    speaker_id: 0
    speed: 1.0
    warmup: true
    max_chunk_tokens: 256
    # sherpa_onnx engine only — vits2_trt runs on TensorRT and ignores this.
    # Matcha is fp32, so both devices load the same weights and only the provider
    # changes; gpu measured ~4.3x faster at num_threads=2.
    device: cpu

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    model_dir: /models/ocr/ppocrv6-small-trt
    device_id: 0
    language: zh
    use_angle_cls: true
    max_side_len: 1600
    det_unclip_ratio: 0.7
    det_thresh: 0.3
    det_box_thresh: 0.5
    rec_min_score: 0.9
    crop_refinement:
      enabled: true
      min_score: 0.9
      min_gain: 0.12
      min_text_length: 2
      profiles: [prefix_65, upper_center, upper_tight]
    empty_result_retry:
      enabled: true
      det_thresh: 0.1
      det_box_thresh: 0.1
    min_interval_ms: 0

  face_recognition:
    enabled: true
    # InsightFace buffalo_sc: SCRFD-500M detector + ArcFace MobileFaceNet.
    # Plain ONNX, so one bundle serves both JetPack lines and x86 dev hosts.
    model_dir: /models/face/buffalo_sc
    # The only host-mounted writable path in this container is /models (see
    # perception/deploy/service.yml), so the identity database lives under it.
    db_dir: /models/face_db
    # cpu | gpu. gpu needs an onnxruntime build carrying the CUDA provider; the
    # image currently ships the CPU wheel, so gpu degrades to cpu with a
    # warning (utils/onnx_provider.ort_providers_for_device). The models are
    # 2.5 MB + 13 MB, so cpu at a throttled frame rate is the design point.
    device: cpu
    num_threads: 2
    warmup: true
    det_size: [640, 640]
    det_thresh: 0.5
    # Cosine similarity between L2-normalised ArcFace embeddings. 0.35 is a
    # starting point for w600k_mbf, NOT a measured value — raise it if the
    # robot confuses people, lower it if it fails to recognise them, and record
    # what you saw. Editable from the card.
    match_threshold: 0.35
    # Quality gate. A face below either bound is reported with person_id: null
    # rather than matched or auto-enrolled: matching a blurred 30 px face is a
    # coin flip, and enrolling one wastes an unknown-N slot forever.
    min_face_px: 64
    blur_min: 60.0          # variance of Laplacian on the aligned 112x112 crop
    # Enrolment refuses to guess when two faces are comparably prominent.
    # Prominence is area discounted 40% for being off-centre.
    subject_dominance: 1.6
    max_faces: 8
    # register_current_stream analyses the last enroll_window_s of frames, up
    # to enroll_max_analyzed of them (newest first), instead of a single grab.
    enroll_window_s: 3.0
    enroll_window_max_frames: 60
    enroll_max_analyzed: 8
    # Ceiling on auto-enrolled strangers; oldest sighting evicted first. Named
    # people are never evicted. Editable from the card.
    unknown_capacity: 500
    max_samples_per_person: 8
    max_batch: 200
    # Caller-supplied image/package paths are confined to these roots — the MCP
    # server has no authentication and runs as root in the container.
    image_roots: ["/models", "/tmp", "/work"]
    min_interval_ms: 200
