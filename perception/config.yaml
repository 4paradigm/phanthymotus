mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  nav2:
    enabled: true
    namespace: ubuntu
    backend: ros_topic
    shadow_only: true
    request_timeout_sec: 30.0
    runtime_switch_timeout_sec: 120.0
    discovery_timeout_sec: 5.0
    input_max_age_ms: 500
    max_forward_mps: 0.15
    max_reverse_mps: 0.15
    max_lateral_mps: 0.0
    max_yaw_rps: 0.35
    max_planar_mps: 0.18
    proposal_ttl_ms: 250
    map_storage_dir: /maps
