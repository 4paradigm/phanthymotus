mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    url: ""
    key: ""
    model: ""
    model_dir: /models/ocr/ppocrv6-tiny
    language: zh
    device: cpu                # 纯 CPU：工作集 350MB(CUDA 1011MB)，单帧 2.95s；要速度改回 cuda(0.83s)
    device_id: 0
    gpu_mem_mb: 512
    # GPU 占用控制（实测 On Orin, tegrastats 均值）：
    #   back-to-back(1600+cls) ~43% → side=960/cls=off + 5s 限帧 ≈ 8%
    #   CPU 模式下 GPU 占用恒为 0，min_interval_ms 仅控制刷新频率
    use_angle_cls: false       # 正立文档场景够用；旋转文字需改回 true
    num_threads: 1
    max_side_len: 960          # 68 items 保持不变，640 会掉精度(54)
    max_input_mb: 16           # 压缩数据超限时只拒绝当前 case
    max_decode_mb: 64          # 解码前按尺寸估算，避免异常大图触发 OOM
    memory_guard:
      enabled: true
      expected_workers: 10     # 榜单观察到的并发 OCR 容器数
      min_decode_mb: 8         # 低于该动态预算时拒绝当前 case
      headroom_ratio: 0.2      # 每个实例最多使用可用余量的 20%
    min_interval_ms: 5000      # 帧处理最小间隔，0=不限帧
    large_image_strategy:
      # 榜单会并发启动多个容器；默认单次缩放推理，避免分块产生内存峰值。
      enabled: false
      trigger_side: 2400
      decode_side: 3200
      decode_hard_limit: 4096
      tile_size: 1280
      overlap: 192
      max_tiles: 6
      global_pass: true
      dedup_iou: 0.5
      dedup_text_similarity: 0.8
