mcp_port: 15720

plugins:
  asr:
    enabled: true
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en | sensevoice-small
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: true
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: true
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    backend: mnn
    fallback_backend: ""
    url: ""
    key: ""
    model: ""
    model_dir: /models/ocr/ppocrv6-tiny-mnn
    fallback_model_dir: /models/ocr/ppocrv6-tiny-ort
    language: zh
    use_angle_cls: false
    num_threads: 1
    max_side_len: 960
    min_interval_ms: 0
    large_image_strategy:
      enabled: true
      trigger_side: 2400
      decode_side: 3200
      decode_hard_limit: 4096
      tile_size: 1280
      overlap: 128
      max_tiles: 12
      global_pass: true
      dedup_iou: 0.5
      dedup_text_similarity: 0.8
