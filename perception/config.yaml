mcp_port: 15720

plugins:
  asr:
    enabled: false
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en
    model_dir: /models/sherpa-onnx/asr
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: true
    backend: vits
    model_name: tts_melo_int8
    model_dir: /models/vits-melo-tts-zh_en_int8
    hw_provider: cuda
    num_threads: 2
    speaker_id: 0
    speed: 1.0
    max_segment_chars: 40
    first_segment_chars: 20
    prebuf_frames: 0
    warmup: true
    warmup_async: false
    warmup_text: "你好，欢迎使用语音合成服务。"
    realtime_pacing: false

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5
