name: ocr-checks

on:
  push:
    branches: [feat/zengzhitao-ocr-pure]
    paths:
      - "perception/**"
      - ".github/workflows/ocr-checks.yml"
  pull_request:
    paths:
      - "perception/**"
      - ".github/workflows/ocr-checks.yml"

permissions:
  contents: read

jobs:
  syntax-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile OCR Python sources
        run: >-
          python -m py_compile
          perception/main.py
          perception/plugins/ocr.py
          perception/plugins/ocr_preprocess.py
          perception/plugins/ocr_runtime.py
          perception/plugins/ocr_tiled_strategy.py
          perception/utils/ocr_model_downloader.py
          perception/tools/build_ocr_tensorrt_engines.py
