name: ocr-checks

on:
  push:
    branches: [feat/zengzhitao-ocr]
    paths:
      - "perception/**"
      - ".github/workflows/ocr-checks.yml"
  pull_request:
    paths:
      - "perception/**"
      - ".github/workflows/ocr-checks.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "numpy==1.26.4" pyyaml
      - name: Compile OCR Python sources
        run: >-
          python -m py_compile
          perception/main.py
          perception/plugins/ocr.py
          perception/plugins/ocr_runtime.py
          perception/plugins/ocr_tiled_strategy.py
          perception/utils/ocr_model_downloader.py
      - name: Run perception contract tests
        run: python -m unittest discover -s perception/tests -p "test_*.py" -v
