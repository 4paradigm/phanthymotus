services:
  deploy-approval:
    build:
      context: ../..
      dockerfile: agents/deploy_approval/Dockerfile
    image: phanthy-motus/deploy-approval:local
    container_name: deploy-approval
    user: "${DEPLOY_APPROVAL_RUNTIME_UID:-65532}:${DEPLOY_APPROVAL_RUNTIME_GID:-65532}"
    # ── Single-replica / single-writer topology ───────────────────────
    # Deploy Approval is restart-safe stateless, but intentionally
    # single-replica / single-writer. Exactly one GitHubCommandWatcher serially
    # processes mutating commands. Multiple concurrent Deploy Controller
    # replicas are unsupported because the current hidden-state protocol has no
    # CAS/distributed lock. Running replicas >1 would violate the at-most-once
    # unsafe-side-effect model.
    restart: unless-stopped
    environment:
      AGENT_CORE_TLS_MODE: "${AGENT_CORE_TLS_MODE-strict}"
      GITHUB_APP_ID: "${GITHUB_APP_ID}"
      GITHUB_INSTALLATION_ID: "${GITHUB_INSTALLATION_ID}"
      GITHUB_APP_PRIVATE_KEY_FILE: "${GITHUB_APP_PRIVATE_KEY_FILE}"
      GITHUB_REPOS: "${GITHUB_REPOS-4paradigm/phanthymotus,4paradigm/phanthymotus-driver}"
      POLL_ENABLED: "${POLL_ENABLED:-true}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-30}"
      WEBHOOK_ENABLED: "${WEBHOOK_ENABLED:-false}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      DEPLOY_EVIDENCE_ENABLED: "${DEPLOY_EVIDENCE_ENABLED:-false}"
      EVIDENCE_PUBLIC_BASE_URL: "${EVIDENCE_PUBLIC_BASE_URL:-}"
      EVIDENCE_OAUTH_CLIENT_ID: "${EVIDENCE_OAUTH_CLIENT_ID:-}"
      EVIDENCE_OAUTH_CLIENT_SECRET: "${EVIDENCE_OAUTH_CLIENT_SECRET:-}"
      EVIDENCE_SESSION_KEY: "${EVIDENCE_SESSION_KEY:-}"
      EVIDENCE_MAX_FILE_BYTES: "${EVIDENCE_MAX_FILE_BYTES:-536870912}"
      EVIDENCE_MAX_VIDEO_BYTES: "${EVIDENCE_MAX_VIDEO_BYTES:-536870912}"
      EVIDENCE_PART_BYTES: "${EVIDENCE_PART_BYTES:-8388608}"
    volumes:
      # Persistent machine policy — fixed host path, read-only inside container
      - type: bind
        source: "${DEPLOY_APPROVAL_CONFIG_DIR:?config directory required}/machines.yaml"
        target: /run/deploy-approval/machines.yaml
        read_only: true
        bind:
          create_host_path: false
      # Persistent COS secrets — fixed host path, read-only inside container
      - type: bind
        source: "${DEPLOY_APPROVAL_CONFIG_DIR:?config directory required}/secrets.yaml"
        target: /run/deploy-approval/secrets.yaml
        read_only: true
        bind:
          create_host_path: false
      # GitHub App private key (absolute path supplied via env var)
      - type: bind
        source: "${GITHUB_APP_PRIVATE_KEY_FILE:?GITHUB_APP_PRIVATE_KEY_FILE is required}"
        target: "${GITHUB_APP_PRIVATE_KEY_FILE:?GITHUB_APP_PRIVATE_KEY_FILE is required}"
        read_only: true
        bind:
          create_host_path: false
    ports:
      # External webhooks require an explicit bind IP and network access controls.
      - "${DEPLOY_APPROVAL_BIND_IP:-127.0.0.1}:25001:25001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:25001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
