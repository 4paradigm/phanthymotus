version: 1

cos:
  region: "ap-beijing"
  bucket: "<bucket-name-appid>"
  secret_id: "<placeholder>"
  secret_key: "<placeholder>"

# TLS mode is a deployment environment setting, not a secrets.yaml field.
# AGENT_CORE_TLS_MODE defaults to strict. Explicit legacy supports configured
# RFC1918 machines without CA/IP SAN; it does not authenticate certificate identity.

agent_core_tokens:
  machine-alias-1: "<token>"
  machine-alias-2: "<token>"

# Review Agent comment trust configuration
# Deploy Approval reads Review Agent output from GitHub PR comments.
# Both the immutable ID and exact login must match the actual GitHub comment.
# Obtain them from the intended Review Agent account; do not copy another user.
# Keep this file protected and mount it read-only. No environment override exists.
review_comment_trust:
  author_id: "<review-agent-numeric-user-id>"
  author_login: "<review-agent-exact-login>"

# Per-machine CA PEM trust anchors for Agent Core TLS verification.
# Each machine alias maps to a PEM-encoded CA certificate.
# Required for every machine in strict mode; optional in explicit legacy mode.
# Supplied PEMs are validated in both modes. Strict mode never uses system CAs
# or falls back to legacy after a failed certificate check.
# To provision: agent_core_ca_pem: {machine-alias-1: <PEM>, ...}, using YAML
# literal blocks (|) for each machine's PEM. Do not commit real credentials.
agent_core_ca_pem: {}
