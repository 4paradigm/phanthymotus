# ActuCore — 执行模型层配置
#
# 与 perception/config.yaml 同构：mcp_port + 每张卡片的开关与参数。
# 当前不带任何卡片，plugins 为空。

mcp_port: 15730

plugins:
  vla:
    # enabled 只决定这张卡片**出不出现**在工具列表和侧边栏里，不决定它动不动。
    # 关掉的话 actucore 又变回一个空的 MCP host，画布上无从连起。
    #
    # 真正的门槛都在别处：
    #   1. 必须在画布上把它的输出连到一张驱动命令卡片（control/* 端口），
    #      否则 start 拿不到下游动作空间，直接拒绝；
    #   2. 协商不通过（动作维度、频率对不上）同样拒绝启动；
    #   3. 每一条指令还要过驱动侧 ControlSink 的检查链。
    # 容器重启也不会让它自己跑起来（bundle 的 start() 是空的）。
    enabled: true
    # provider 由 plugins/vla/providers/ 目录发现，不写死在这里。
    # 本地一个模型一个（按模型名），远端统一一个。
    #   mock       正弦轨迹，无模型、无网络、无 GPU —— 验证通路用
    #   smolvla    LeRobot SmolVLA，本机推理（只有 jp6.1 的镜像有）
    #   vla_cloud  任何跑在别处的模型，只配 endpoint + key + model
    provider: mock
    # 输出口在**连线时**长什么样。画布按严格字符串相等匹配端口，而连线发生在
    # start 之前 —— 那时还没有 descriptor，所以这个空间只能由配置给出。
    #   joint_position → control/joint   （servo 那类关节卡片）
    #   eef_pose       → control/eef     （servo_eef 那类末端位姿卡片）
    # 协商之后以下游 descriptor 的 mode 为准；填错会在协商处被响亮拒绝，不会静默。
    action_space: joint_position
    topic: /actucore/vla/cmd
    # 留空则取 min(模型 control_hz, 下游 expected_hz)，再被下游 max_hz 夹住。
    rate_hz: null
    # 指令流的优先级。遥控器一类应当高于策略，驱动侧 ControlSink 据此仲裁。
    priority: 50
    # ACP 物理通道，决定这张卡片和谁互斥。只是**协商之前**的占位：
    # start 之后以下游 descriptor 的 groups 为准（天轶是 arm_l/arm_r/hand_l/hand_r），
    # agent-core 在心跳时会重新读 schema，拿到真实的那一组。
    resource: arm

    # ── provider: mock ───────────────────────────────────────────────────
    # 幅度 = 从**静止位**（0，夹进量程）到量程边界那段行程的比例，默认很小。
    # 不再绕量程中点摆：那个中点是一个姿态，而天轶的中点是"双臂侧举 67°、手半握"，
    # 于是第一条指令就把机器人推到那里，看起来像幅度太大，其实是中心点不对。
    #
    # 一个数字给所有关节，也可以给字典 —— 同一个比例在不同 group 上观感差很多：
    # 天轶手臂 5% 是 7.5°，一眼看得见；手指 5% 是 0.05（行程 0-1），看着就像手
    # 根本没被驱动，而这正是它被报上来的方式。
    #
    # 字典的 key 可以是 group 名（hand_l），也可以是 group 的单位（normalized）。
    # 默认写成单位而不是名字：名字每台机器人自己起，单位来自 descriptor 规范，
    # 在哪台机器人上都成立。名字优先于单位，都没命中用 default。
    amplitude:
      default: 0.05
      normalized: 0.5
    period_s: 8.0
    chunk_size: 10

    # ── provider: vla_cloud（远端）────────────────────────────────────────
    # 和 agent-core 配 LLM 是同一个形状：地址 + key + 模型名，没有别的。
    # 注意它说的是我们自己的 motus.vla/1 协议，不是 openpi 的 WebSocket 或
    # LeRobot 的 gRPC —— 翻译在服务端（phanthymotus-cloud）做，机器人这侧
    # 不背每种服务器一个适配器。
    #
    # 这三项只在 provider = vla_cloud 时显示（schema 里的 x-show-when）：
    # 本机 provider 旁边填着一个 endpoint，看起来像配好了，实际被忽略。
    endpoint: ""
    api_key: ""
    # 服务端认得的模型名，自由填写 —— 这些名字住在服务端，不是我们能枚举的。
    # 和下面本机的 model_name 是**两个字段**，因为表单把 enum 渲染成 <select>：
    # 一个字段同时承载两者的话，选了 vla_cloud 就只能从本机 checkpoint 里挑，
    # 反而填不了服务端的名字。
    cloud_model_name: ""
    # 每次请求的超时——是"放弃的时刻"，不是预期延迟。
    # 回包迟到不是安全问题：驱动会丢掉观测年龄超过 descriptor 里 max_obs_age_ms
    # 的指令（当前 300ms），而它的 watchdog 早已让机械臂保持住了。超时设得过大
    # 只是让"端点已经死了"这件事更晚被发现，所以没必要远高于那个年龄上限。
    timeout_ms: 500

    # ── 选哪个 checkpoint ────────────────────────────────────────────────
    # 本机 provider 从下面 models: 里挑（远端的是上面的 cloud_model_name）。
    # 开源发布的沿用上游原名；为某台机器人微调过的用带机器人名的名字，
    # 因为"它适配的动作空间"正是操作员必须搞对的东西。
    #
    # 说明写在这里而不是 schema 的 description 里：表单的标签是
    # `title || description || key` 且没有单独的提示位，写在那里会把字段名顶掉。
    model_name: smolvla_base

    models:
      # 上游原版：SO-100/SO-101 的 6 维，驱动不了天轶（26 维），协商会拒绝。
      # 留在这里是因为它是唯一公开可得、能验证整条本机推理链路的 checkpoint。
      smolvla_base:
        model_dir: /models/vla/smolvla_base
        # 用哪个数据集的统计量做反归一化。
        #
        # 登记在这里而不是让人去表单里填，因为**哪一组合适是权重的属性**，和
        # model_dir、weights 一样随 checkpoint 一起来。
        #
        # 这个 checkpoint 是多数据集预训练基座，统计量按数据集分组
        # （so100 / so100-blue / so100-red），而 pipeline 查的是无前缀的 `action`。
        # LeRobot 把查不到当成"没什么要做的"、不是错误 —— 所以不设的话反归一化会
        # 静默变成恒等，卡片输出的是策略的归一化空间（≈ ±1），而下游的描述符、限位、
        # 机械臂读的是度。实测过：输出 |max| = 0.89，而 so100 的 mean ∈ [-27, 120]。
        #
        # 那不是"动得小一点"：让行程几十到一百多度的关节去到接近 0 的目标，是把它
        # 推向限位。provider 现在不设就拒绝加载。
        #
        # 在自己数据上微调过的 checkpoint 写的是无前缀 `action`，这一项可以不写。
        unnorm_key: so100
        weights:
          # 两条源，机器自己挑。下载器按**最大的那个文件**做一次 Range 探测，
          # 快的先用，失败则顺延。多源之所以安全，是因为每个文件都 pin 了
          # size+sha256 —— 校验与来源无关，所以换源不降低任何保证。
          base_url:
            - https://www.modelscope.cn/api/v1/models/lerobot/smolvla_base/repo?Revision=master&FilePath={file}
            - https://agi-phanthy-dev-1252788780.cos.ap-beijing.myqcloud.com/public/vla/smolvla_base
          files:
            config.json:
              size: 2299
              sha256: "650584b56c104720f7a3c91d1ec6bec9e8de8ac11e60c92ba2fa82d93eda147d"
            model.safetensors:
              size: 906712520
              sha256: "7cd549ac2351fb069c0ddb3c34ad2d09cfc92b56a15dccdfc2e41467aaca01eb"
            policy_preprocessor.json:
              size: 1872
              sha256: "7683d648280a72f0d51e869fb8dd1596beed90b7f84849330cf1bc26634a4bd6"
            policy_postprocessor.json:
              size: 660
              sha256: "2b78bb742065288df2ec63b0ee35f97a1f6950171cf2272f7e34b1fe3873b17b"
            policy_preprocessor_step_5_normalizer_processor.safetensors:
              size: 640
              sha256: "490ab239d96e263687c0b2e386a0afbc235a2eceb9857c36ed32f2f162a3e7c8"
            policy_postprocessor_step_0_unnormalizer_processor.safetensors:
              size: 640
              sha256: "490ab239d96e263687c0b2e386a0afbc235a2eceb9857c36ed32f2f162a3e7c8"
        # smolvla_base 的 config.json 期望 observation.images.camera1/2/3 和
        # observation.state（各 6 维）。缺哪个就报哪个，不会拿黑图去推理。
        feature_map: {}
        #   main:  observation.images.camera1
        #   wrist: observation.images.camera2
        #   state: observation.state

      # 微调版按同样的形状加在这里，各自一份 weights 清单：
      # smolvla_tianyi:
      #   model_dir: /models/vla/smolvla_tianyi
      #   weights: {base_url: [...], files: {...}}
      #   feature_map: {main: observation.images.camera1, state: observation.state}

    # ── provider: smolvla（本机）──────────────────────────────────────────
    # 需要镜像带 lerobot，即 jp6.1 的 jetson-base-actucore。jp5.11 上会在
    # start 时明确拒绝并说明原因（CUDA 11.4 撑不住 torch >= 2.2.1）。
    device: cuda
    vlm_weights:
      base_url:
        - https://www.modelscope.cn/api/v1/models/HuggingFaceTB/SmolVLM2-500M-Video-Instruct/repo?Revision=master&FilePath={file}
        - https://agi-phanthy-dev-1252788780.cos.ap-beijing.myqcloud.com/public/vla/smolvlm2_500m
      files:
        added_tokens.json:
          size: 4739
          sha256: "74135b8664b56088c0006f1c8e848d79a8eba003411f72ebf1dc2ee96227be3a"
        chat_template.json:
          size: 430
          sha256: "b585e3598909a5687f9f9d738d35223724dedef256b9b274e1cbfb32b13c74bf"
        config.json:
          size: 3767
          sha256: "ea6bc1237e96247f6258de3e202e2e62b93d6f386dc47e7b36b5588bf3a15e17"
        generation_config.json:
          size: 136
          sha256: "34835060c9f0f74d1acb456cc72ca32746d3843d9eb5f578f9cbffac1d2eb840"
