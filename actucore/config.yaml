  # nav:
  #   enabled: true
  #   map_dir: /models/maps
  #
  # 卡片名要和 main.py 里 ActuCoreBundle 的注册块、以及插件的 PREFIX 对上。

  navi:
    # **这个文件是这张卡片绝大多数参数唯一的家。**
    #
    # 卡片的 configSchema 只暴露三个：rate_hz、stop_distance_m、obstacle_stop_m
    # —— 操作员能判断的那三个。其余全在这里，因为它们需要的是一段解释而不是一个
    # 输入框；要调的人仍然可以用 config 动作改。
    #
    # 还有一条更要紧的理由：**agent-core 每次 config 调用都会把 schema 里的字段
    # 连同默认值一起下发**，所以出现在 schema 里的键会静默覆盖这里的同名键。
    # r1_sz 上这里写着 vx_max: 0.6 而卡片报的是 0.4，就是 schema 默认值赢了 ——
    # 唯一的痕迹是一条读起来像「这个文件从没被改过」的 degraded 提示。
    #
    # 所以往 schema 里加字段之前先想清楚：加进去就等于把这里的对应项变成装饰。
    # test_navi_card.py 有一条测试盯着两边的默认值必须一致。
    #
    # 视觉导航。enabled 只决定这张卡片出不出现在工具列表和侧边栏里，不决定它动
    # 不动 —— 和 vla 一样，真正的门槛都在别处：
    #   1. 必须在画布上把输出连到一张驱动的底盘命令卡片（control/velocity 端口），
    #      否则 start 拿不到下游动作空间，直接拒绝；
    #   2. 必须连上 vop 的检测结果，以及深度图或深度摘要中的至少一路；
    #   3. 协商不过（这张卡片只产生 twist，接到关节卡片上就是不匹配）同样拒绝；
    #   4. 每一条指令还要过驱动侧 ControlSink 的检查链。
    # 容器重启不会让它自己跑起来，也不会让它继续走一个小时前的目标。
    enabled: true
    topic: /actucore/navi/cmd
    # 第二个输出口，只给人看：深度图 + 走廊 + 目标框与距离 + 三个轴的指令箭头。
    # 留空则由上面的指令话题派生（/actucore/navi/cmd → /actucore/navi/view）。
    #
    # 存在的理由：这张卡片至今每一个 bug 都是同一个形状 —— **数字看着都合理，机器人
    # 做了别的事**。视场角把走廊撑到 1.86 m、角度三等分读的是镜筒而不是房间、横移被
    # 死区放大 9 倍，三次都在 info() 里看不出来，而站在机器人旁边看一眼就明白。
    view_topic: ""
    # 渲染频率。0 = 关掉。与指令流的 rate_hz 分开限流，且渲染整段被包住 ——
    # 给人看的图不允许把机器人弄停。
    view_hz: 5
    # 留空则取 min(本卡片 control_hz, 下游 expected_hz)，再被下游 max_hz 夹住。
    rate_hz: 10
    # 指令流优先级。遥控器一类应当高于策略，驱动侧 ControlSink 据此仲裁。
    priority: 50
    resource: base

    # ── 三个距离，必须保持 obstacle_stop < stop_distance < slow_distance ──
    # 目标本身也是障碍（它出现在同一组深度分段里），所以 obstacle_stop 一旦追上
    # stop_distance，机器人就会被它正要走向的那个东西挡停，永远到不了。
    #
    # 三个都是从**相机**算起，不是从机器人最前端算起 —— 会走路的人形，躯干和摆
    # 动中的腿都在镜头前面，这是 obstacle_stop 不能按几何下限取的原因。
    # 下面三个距离和三个速度上限是 2026-09-23 在 r1_sz 上调出来的一组，机器人
    # 跟着人走了几趟、转向也不再顿挫之后定下来的。改之前先想清楚改的是哪台机器
    # 人的问题 —— 它们不是从几何算出来的，是量出来的。
    #
    # align_tol 不在这一组里：画布上跑的 0.08 是被裁掉的旧 schema 默认值一直在
    # 覆盖这里，而 0.15 才是为了解开近距离死锁调上去的值（见下）。
    stop_distance_m: 0.8
    # 全速前进所允许的横向偏移。**不是硬门** —— 超过它按比例减速，到
    # align_full_stop 才完全不前进。
    #
    # 硬门在近处必然死锁：bearing 是归一化横向偏移而不是角度，同样的侧移在
    # 0.7 m 处远大于在 5 m 处，于是站在机器人面前的人只要轻微移动就跨不过门，
    # 表现为「人就在前面，动的却一直是 wz」。
    align_tol: 0.15
    align_full_stop: 0.45
    # 判定到达时的对正容差，比上面松得多 —— 位置到了才是到了，朝向是锦上添花。
    # 用 align_tol 当到达条件，等于要求站在面前的人一动不动。
    arrive_align_tol: 0.30
    # 已进入停止距离却迟迟对不正时，多久之后接受「到了」。没有它就会无限打转，
    # 而 idle 超时也救不了 —— 转向算运动。
    arrive_patience_s: 3.0

    # ── 避障 ─────────────────────────────────────────────────────────────
    # 走廊内近于 slow 就按比例减速，近于 stop 就完全不前进，同时转向更开阔的
    # 一侧、并朝那一侧横移一步。只转不移改变的只是朝向，横移才真的让开。
    # 不做后退：深度图只覆盖相机看到的部分，身后一无所知，倒车就是盲走。
    slow_distance_m: 1.5
    obstacle_stop_m: 0.6

    # 「走廊」是米制的，不是画面的三等分。
    #
    # 画面的固定扇区在不同距离覆盖不同的实际宽度：63° 镜头的中间那份是
    # ±0.204×距离，0.8 m 处只有 ±0.16 m —— **比机器人肩膀还窄**，而 0.8 m 正是
    # 要做决定的距离。门框偏轴 0.25 m 会被归到「左」，而左带从来不停止前进，
    # 于是肩膀撞上去、深度图却报告前方通畅。
    #
    # 半宽由底盘在 descriptor 的 footprint 里声明（R1 整体宽 357 mm），这里只给
    # 余量：声明的是**手臂放下时的静态外廓**，而真正会撞的是摆动的手臂和迈出去
    # 的腿。没有声明就按保守值走，并在 info().degraded 里明说。
    clearance_margin_m: 0.15

    # 「不知道」不等于「没东西」。
    #
    # 深度图有洞，而造成洞的东西 —— 椅子腿、桌沿、玻璃 —— 正是会挂到肩膀的那些。
    # 无效像素会悄悄从最小值里掉出去，所以满是空洞的走廊和空旷的走廊给出同一个
    # 数。现在走廊有效像素比例低于 coverage_min 就不往前走并说明原因，介于两者
    # 之间按比例减速。
    coverage_min: 0.25
    coverage_full: 0.60

    # ── 三轴同时动 ───────────────────────────────────────────────────────
    # 接近速度按目标方位角拆成 vx / vy，也就是朝目标走直线，同时 wz 把朝向拧
    # 正。第一版是串行的（没对正就 vx=0），在 r1_sz 上的表现是每次修正方位都顿
    # 一下。不能横移的底盘配 align_min_scale: 0 + use_lateral: false 退回原走法;
    # 驱动的 descriptor 把 vy 钉成 0 的话会被自动识别，不用配。
    use_lateral: true
    # 只缩放横移分量。小于 1 就是更多靠转、更少靠横移 —— 保守方向，因为深度图
    # 朝前，侧面是它最不了解的方向。要迈的那一侧深度段还必须已知且空旷。
    lateral_scale: 1.0
    # 目标偏出这个范围就只转不移：画面边缘的方位角和深度段都最不可信。
    lateral_max_bearing: 0.7
    # 只有当「诚实的横移速度」至少是横移死区的这个比例时才真的横移。
    #
    # **_lift 在有死区的轴上不是免费的。** 它把拿到的值抬到地板速度，于是目标偏离
    # 中心 0.05 时算出的 0.04 m/s 会变成 R1 的最小横移 0.4 m/s —— 放大 **9 倍**，
    # 表现就是每次起步都先来一个没必要的侧移，然后才朝人走。偏航轴早就有这层门
    # （_finalise_yaw 和它的 Gate），横移轴没有，这就是那个 bug。
    #
    # 0.5 = 最多允许 _lift 放大 2 倍。低于这个就交给偏航去收，它本来也在转。
    lateral_lift_ratio: 0.5
    # 目标偏到 align_full_stop 以外时保留的前进速度比例。0 = 停下先转正。
    align_min_scale: 0.45
    # 相机水平**半**视场角 —— **兜底值，不是答案。**
    #
    # 现在这个数由相机自己声明（motus.camera/1，见 phanthymotus-driver 的
    # README_dev.md），沿画布连线一路传到这里，启动时由 _adopt_camera 采纳，采纳了
    # 什么会写进 info().degraded。下面这个值只在**上游什么都没声明**时生效。
    #
    # 它刻意取在偏小的一侧：视场角偏小 → 走廊偏宽 → 拒绝走得过的缝（卡住，但不撞）；
    # 偏大 → 走廊偏窄 → 肩膀撞门框。卡住能恢复，撞了不能。
    #
    # 两处用到它，而且第二处远比第一处要紧：
    #   1. 把归一化横向偏移换成角度（全文唯一一处把 bearing 当角度用的地方 ——
    #      align_tol 那些全是归一化值）；
    #   2. **把米制的走廊半宽反算成画面上的像素列范围。**
    #
    # 填错了，第二处会静默地把走廊放宽或收窄。2026-09-23 在 r1_sz 上：这里写着
    # 0.55（≈63° 全视场，普通镜头的出厂值），而实测是 0.888（≈102°，超广角）。
    # 于是在 1 m 处，「半宽 0.5 m 的走廊」采样了画面半宽的 84%，那 84% 真实对应
    # ±0.93 m —— **走廊实际有 1.86 m 宽，比任何一扇门都宽**。结果门框永远算在
    # 「正前方」里，clearance 读到的是门平面而不是穿过门洞的距离，机器人走到离门
    # 0.6 m 触发 obstacle_stop 转向旁边，人随即出画、轨迹丢失、转入搜索扫描。
    # 现场看到的就是「到门口先转向，然后原地转身」，而深度图报告前方通畅。
    #
    # **换相机就必须重新量**，别沿用：actucore/tools/measure_fov.py，把一个已知
    # 宽度的平面物体放在尺子量过的距离上。r1_sz 的 0.888 是 1.8 m 处一张 1.2 m
    # 的桌子拟合出来的。
    #
    # 一个已知的近似：超广角实际是鱼眼，不是针孔，tan() 在画面边缘会高估横向偏移
    # （偏保守）。走廊只用到中间约 52%，这个范围内针孔模型够用。
    half_fov_rad: 0.888

    # ── 速度上限 ─────────────────────────────────────────────────────────
    # 真机第一次跑建议先压低看行为，再往上调。
    #
    # 上限必须高过下游声明的死区，否则策略的整个输出范围都落在「发了等于没发」
    # 的区间里，每条指令被吸附成 0 或死区值 —— 一个 10 Hz 方波，手感就是顿挫。
    # 现在 adopt_limits 会在启动时读 descriptor 的 min_magnitude 自动把上限抬
    # 离地板（并压回 descriptor 允许的范围），调整内容写在 info().degraded 里。
    # 下面这两个值仍然生效，只是不会再因为配低了而静默失效。
    vx_max: 1.0
    vy_max: 1.0
    wz_max: 1.5

    # ── 迟滞 ─────────────────────────────────────────────────────────────
    # 有死区的机器人没法慢慢修小误差，只能短促地修，所以每个轴是个开关。误差在
    # 阈值上抖动会让开关以 tick 频率翻转，两条都是为了压住这个：释放阈值取触发
    # 阈值的这个比例，以及一旦打开至少保持这么久。
    release_frac: 0.4
    min_dwell_s: 0.25

    # ── 丢目标与卡死 ─────────────────────────────────────────────────────
    # 连续这么多帧没看到才开始转着找 —— 有人走过去挡一下不该触发搜索。
    lost_frames: 10
    # 搜索的终止条件是**转满一圈**（search_sweep_rad），那是行为判据 ——
    # 「我转了一圈，它不在这儿」。下面这个挂钟值只是兜底，不是主判据。
    # 搜索时的转速。必须高过下游声明的死区，否则搜索指令会被归零 —— 卡片报着
    # 「searching」而机器人一动不动。R1 的死区是 1.0 rad/s。
    search_rate: 1.0
    search_timeout_s: 30.0
    # 任务失败判定：多久没有发出任何运动指令。刻意不是「navigate_to 跑了多久」
    # —— 一台正稳稳走向三十米外目标的机器人是在正常工作，按总时长超时会因为它
    # 走得慢而把它判失败。没在发运动指令才真的说明任务停滞，而这一条同时覆盖了
    # 看不见、被遮挡、下游拒绝执行、以及什么都没决定出来。转向算运动，发全零不算。
    idle_timeout_s: 10.0
    # 指令在走而实测速度不到指令的这个比例，持续 stuck_window_s，判定被挡住。
    # 只在接了 state/odom 且它确实报 vx 时生效；没接就是没有这层保护，info()
    # 里会明说。
    stuck_window_s: 3.0
    stuck_speed_ratio: 0.2

    # 任何一路观测比这个旧，就什么都不发，交给下游 watchdog 把底盘停住。
    # 拿上一条指令顶着才是危险的。
    max_obs_age_ms: 500

    # ── 目标跟踪（plugins/navi/track.py）─────────────────────────────────
    # 开始追一个目标的置信度门槛。
    min_confidence: 0.35
    # 低于上面这个值的检测**不能新建**轨迹，但可以维持一条已有的 —— 前提是它落
    # 在预测位置的门内。部分遮挡恰恰会让检测器掉置信度，所以把这一段直接丢掉，
    # 等于丢掉遮挡本身制造出来的那些帧（ByteTrack 在 MOT20 上靠这条把 ID 跳变砍掉
    # 71%）。
    #
    # 注意它现在只有一小段真正可用：vop 自己的 confidence 默认 0.3，所以低置信
    # 区间实际只有 [0.30, 0.35)。要拿到 ByteTrack 那种量级的收益得把 vop 的阈值
    # 降下来，但 vop 没有 max_objects 上限，降阈值会整体放大检测流（而整条载荷
    # 是会进 LLM 上下文的）。这一步留到真机量过再说。
    sustain_confidence: 0.15
    # 最近 confirm_window 帧里出现 confirm_hits 帧，轨迹才允许驱动底盘。
    # 改之前先想清楚方向：原来是 1 帧起步、10 帧放弃，而起步才是会让机器人动起
    # 来的那一侧。
    confirm_hits: 3
    confirm_window: 5
    # 目标看不见时，允许按预测继续驱动多久。有人从面前走过大约半秒；超过这个时
    # 间外推就是猜了（OC-SORT 量过这个猜测烂得多快），到点转入搜索。
    max_coast_s: 1.2
