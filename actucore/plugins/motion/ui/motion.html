<header><div class="breadcrumb"><button id="breadcrumbActions" data-tab="data">动作</button><span id="breadcrumbName"></span><span id="breadcrumbPage"></span></div><span id="currentRobot" class="muted"></span><button id="environmentTask" class="small hidden">环境任务</button><button id="environmentButton" class="connection-status">服务器</button><button id="connection" class="small">连接</button></header>
<main>
<section id="data" class="tab"><div class="motion-layout v3-actions"><aside class="panel stack action-rail"><div class="row"><h3 class="grow">我的动作</h3><button class="small" id="importAction">导入</button><button class="small" id="refresh" aria-label="刷新动作列表">↻</button></div><div id="datasets" class="list"><div class="empty">暂无动作</div></div><details id="importDetails"><summary>导入动作</summary><div class="stack"><label>机器人<select id="profile"><option value="">未加载</option></select></label><div id="profileInfo" class="muted hidden"></div><label>动作文件<input id="file" type="file" accept=".npz"></label><div class="row"><button id="upload">导入动作</button><span id="uploadState" class="muted"></span></div><div class="progress hidden" id="uploadProgress"><span></span></div></div></details></aside><div class="reference-slot" id="actionReferenceSlot"><div class="reference-dock" id="referenceDock"><div id="datasetPreview" class="reference-view"><img id="referenceImage" class="hidden" alt="动作参考姿态"><div id="referenceGesture" tabindex="0" aria-label="拖动旋转参考动作视角"></div><span id="referenceState" class="empty">选择动作</span><span class="viewport-badge">参考动作</span></div><div class="row reference-controls"><button id="referencePlay" disabled="">播放参考动作</button><input id="referenceFrame" class="grow" type="range" min="0" max="0" value="0" aria-label="参考动作帧"><span id="referenceTime" class="muted"></span></div></div></div><div class="panel stack action-content"><div class="row action-title"><h3 id="motionTitle" class="grow">选择动作</h3></div><span id="motionDuration" class="hidden"></span><div class="action-summary" id="actionSummary"></div><div class="hidden"><select id="previewJoint"></select><canvas id="previewPlot"></canvas><input id="previewFrame" type="range"><span id="previewTime"></span></div><section id="modelHistory"><h4>训练版本</h4><div id="actionVersions" class="version-list"></div></section><div class="version-actions"><button id="retrain">训练新版本</button><button id="openTraining">训练记录</button><button id="openEvaluation" data-tab="modelDetails">模型详情</button></div><div class="hidden"><select id="motionModel"></select><button id="openExport" data-tab="modelDetails">导出模型</button><div id="datasetInfo"></div><details id="datasetDetails"><summary>动作详情</summary><pre id="datasetRaw"></pre></details></div><div class="action-primary"><div class="grow"><strong id="selectedModelName"></strong><div id="selectedModelState" class="muted"></div></div><button id="motionPrimary" class="primary" disabled="">选择动作</button></div></div></div></section>
<section id="training" class="tab hidden"><div class="training-layout"><div class="reference-slot train-reference" id="trainingReferenceSlot"></div><div class="train-setup stack"><div class="row"><h3 class="grow">训练动作</h3><span id="trainConnection" class="tag">未连接</span></div><div id="trainingContext" class="motion-context"></div><div class="training-summary" id="trainingSummary"></div><div class="hidden"><select id="trainProfile"></select><select id="trainDataset"></select></div><div id="allocation" class="gpu-summary"></div><div id="trainValidation" class="invalid" role="status"></div><details id="trainingAdvanced"><summary>高级设置</summary><div class="stack"><div class="fields training-counts"><label>训练预设<select id="preset"><option value="small">小规模</option><option value="standard">标准</option></select></label><label>迭代次数<input id="iterations" type="number" value="1000" min="1" max="1000000" step="1"></label><label>机器人实例总数<input id="numEnvs" type="number" value="64" min="1" max="8192" step="1"></label></div><details id="gpuAdvanced"><summary id="gpuSummary">高级选项 · 自动调度</summary><div class="stack"><div class="row"><label class="grow">调度方式<select id="gpuMode"><option value="auto">自动调度</option><option value="manual">手动选择</option></select></label></div><div id="manualGpu" class="stack hidden"><div class="row"><h3 class="grow">GPU<span id="gpuModel"></span></h3><span id="resourceTime" class="muted"></span><button id="refreshResources" class="small">刷新资源</button></div><div id="gpuQuickSelect" class="row"><button data-gpu-count="1" class="small">1 张</button><button data-gpu-count="2" class="small">2 张</button><button data-gpu-count="4" class="small">4 张</button><button data-gpu-count="8" class="small">8 张</button></div><div id="gpuList" class="gpu-list"><div class="empty">尚未读取资源</div></div></div></div></details></div></details></div><div class="job-panel stack"><div id="jobHeading" class="row"><h3 class="grow" id="trainingSceneTitle">训练动作</h3><span id="jobStatus" class="tag">未选择</span><div id="jobProgress" class="stack hidden training-progress"><div class="row"><span id="jobProgressText" class="grow"></span><span id="jobPhase" class="tag hidden"></span></div><progress id="jobProgressBar" class="hidden" max="1" value="0"></progress></div></div><div id="jobAllocation" class="hidden"></div><div id="jobMessage" class="hidden"></div><section id="trainingPreview" class="stack hidden"><div class="row"><h3 class="grow">训练画面</h3><span id="previewStatus" class="tag"></span><span id="previewActions"></span><button id="closePreview" class="small hidden" aria-label="关闭训练监看">关闭</button></div><img id="trainingImage" class="hidden" alt="训练任务真实机器人采样画面"></section><details id="jobDetails"><summary>任务详情与日志</summary><div id="jobInfo"></div><div id="jobProgressInfo"></div><div id="jobArtifacts" class="hidden"></div><details id="jobHistory"><summary>历史任务</summary><div id="jobs" class="list"><div class="empty">暂无任务</div></div></details><details id="trainingPreviewDetails"><summary>采样信息</summary><div id="trainingPreviewInfo"></div><div id="trainingSamples" class="muted"></div></details><details id="jobLogDetails"><summary>日志</summary><pre id="jobLog"></pre></details></details></div></div><div class="workbench-actions training-setup-footer"><button class="" id="trainingBackAction" data-tab="data">返回动作</button><span class="grow"></span><button id="train" class="primary" disabled="">开始训练</button></div><div id="jobActions" class="workbench-actions training-job-footer"><button class="small" id="trainingSetupBack">训练设置</button><span class="muted grow" id="trainingElapsed"></span><button id="cancel" disabled="">停止训练</button><button id="watchTraining" disabled="" class="hidden">查看训练</button><button id="jobTrial" class="primary hidden">在仿真里试跑</button><span class="muted" id="trainingOutcome"></span><button id="jobModel" class="hidden">模型详情</button></div></section>
<section id="environment" class="tab hidden"><div class="environment-layout"><div class="environment-asset"><span class="viewport-badge">机器人资源</span><img id="environmentAsset" alt="机器人资源参考姿态" class="hidden"><div id="environmentAssetPlaceholder"><svg viewBox="0 0 120 180" aria-hidden="true"><rect x="43" y="12" width="34" height="28" rx="12"></rect><path d="M42 50h36l8 57H34z"></path><path d="M31 53L16 98l10 4 17-42M89 53l15 45-10 4-17-42M43 110l-7 54h16l9-54M65 110l3 54h16l-7-54"></path></svg><strong>机器人资源</strong></div></div><div class="environment-setup stack"><div class="row"><h3 class="grow">连接与准备</h3><span id="environmentConnection" class="tag"></span><span id="environmentState" class="tag"></span></div><label id="environmentTargetLabel">服务器<select id="environmentTarget"></select></label><div id="environmentSummary" class="muted"></div><div id="environmentStage"></div><div id="environmentChecks" class="stack"></div><div id="environmentMessage" role="status"></div><details id="environmentAdvanced"><summary>环境设置</summary><div class="stack"><label>准备方式<select id="environmentMode"><option value="reuse">接入已有环境</option><option value="isolated">安装独立环境</option></select></label><button id="environmentInstall">准备所选环境</button></div></details><details class="environment-logs"><summary class="">准备日志</summary><pre id="environmentLog"></pre></details></div></div><div class="workbench-actions environment-actions"><button id="environmentPrimary" class="primary">连接并检查</button><button id="environmentCancel" class="hidden">取消</button><button id="environmentContinue" class="hidden">返回动作</button></div></section>
<section id="simulation" class="tab hidden"><div class="sim-shell"><div class="row"><h3 class="grow" id="sim-title">仿真试跑</h3><span class="tag">仿真执行</span><span id="sim-sessionState" class="tag">未加载</span><span id="sim-modeLabel" class="muted"></span><span id="sim-controlState" class="tag"></span><button id="sim-claim" class="small hidden">接管控制</button><button id="sim-release" class="small hidden">交出控制</button><button class="small" id="simulationModelDetails">模型详情</button></div><div id="sim-viewer"><canvas id="sim-view" tabindex="0" aria-label="拖动旋转、滚轮缩放仿真机器人"></canvas><img id="sim-renderedView" class="hidden" alt="MuJoCo 实际仿真画面"><div class="sim-viewtools"><button id="sim-center" class="small">居中</button><button id="sim-refreshView" class="small">刷新画面</button><span id="sim-simTime" class="tag">0.00 s</span></div><span id="sim-empty">从动作页选择模型</span></div><div class="workbench-actions sim-actions"><button id="sim-run" class="primary" disabled="">开始试跑</button><button id="sim-pause" class="primary hidden" disabled="">暂停试跑</button><button id="sim-reset" disabled="">重新开始</button><button id="sim-closeSession" disabled="">结束试跑</button><span class="grow"></span><span id="sim-recordCount" class="muted"></span><span id="sim-status" class="muted"></span></div><div id="sim-replayBar" class="row hidden"><span>仿真录制</span><input id="sim-replayFrame" class="grow" type="range" min="0" max="0" value="0" aria-label="仿真录制帧"><span id="sim-replayLabel"></span><button id="sim-live" class="small">返回实时</button></div><details id="sim-debug" class="hidden" aria-hidden="true"><summary>诊断与录制</summary><div class="sim-debug-grid"><div class="stack"><div class="row"><button id="sim-step" disabled="">单步</button><select id="sim-viewMode" aria-label="诊断视图"><option value="render">MuJoCo 画面</option><option value="skeleton">诊断 · 骨架</option><option value="geometry">诊断 · 碰撞几何</option></select></div><div class="row"><button id="sim-record" disabled="">录制</button><button id="sim-recordStop" disabled="">结束录制</button><button id="sim-replay" disabled="">播放录制</button></div><label>施力部位<select id="sim-body"></select></label><div class="fields"><label>X 方向力 / N<input id="sim-fx" type="number" min="-200" max="200" value="10"></label><label>Y 方向力 / N<input id="sim-fy" type="number" min="-200" max="200" value="0"></label></div><button id="sim-perturb" disabled="">施加扰动</button></div><div><dl id="sim-stateInfo" class="kv"></dl><div id="sim-jointTable"></div></div></div></details></div></section>


<section class="tab hidden" id="modelDetails"><div class="model-heading row"><button class="small" id="modelBack" data-tab="training">返回训练</button><h3 class="grow" id="modelDetailsTitle">训练结果</h3><span class="tag" id="modelDetailsState"></span></div><div class="model-layout"><div class="model-record stack"><div class="panel stack"><h3 class="">训练记录</h3><div id="modelInfo"></div></div><details class="panel"><summary class="">历史训练结果</summary><div class="list" id="modelVersions"></div></details></div><div class="model-work stack"><section id="evaluation" class="panel model-check stack"><h3 class="">仿真检查</h3><div class="model-check-body"><div class="model-reference"><img id="modelReferenceImage" alt="参考动作" class="hidden"><span class="viewport-badge">参考动作</span></div><div class="model-check-summary stack"><div id="evalResult" class="muted">未选择评测任务</div><button id="evaluate" class="primary" disabled="">开始检查</button></div></div><select id="evalModel" class="hidden"></select><select id="evalDataset" class="hidden"></select><div id="evalJobs" class="list hidden"></div><details id="evalDetails" class="hidden"><summary>详情</summary><pre id="evalRaw"></pre></details><div id="evalReplay" class="stack hidden"><label>执行 / 参考<select id="evalJoint"></select></label><canvas id="evalPlot" style="width:100%;height:160px" aria-label="执行与参考动作对比"></canvas><div class="row"><span style="color:#b55b36">执行</span><span style="color:#577984">参考</span></div><input id="evalFrame" type="range" min="0" max="0" value="0" aria-label="评测回放帧"><span id="evalTime" class="muted"></span></div></section><section id="publish" class="panel model-export stack"><h3 class="">模型导出</h3><select id="exportModel" class="hidden"></select><div id="exportResult" class="muted">暂无模型包</div><button id="export" class="primary" disabled="">导出模型包</button><details id="exportDetails" class="hidden"><summary>详情</summary><pre id="exportRaw"></pre></details></section></div></div><div class="workbench-actions"><span class="grow"></span><button class="primary" id="modelTrial">在仿真里试跑</button></div></section></main><footer id="status" role="status" aria-live="polite">正在连接</footer>
<dialog id="settings"><div class="stack"><div class="row"><h2 class="grow">连接服务器</h2><button id="closeSettings" class="small" aria-label="关闭">✕</button></div><div id="connectionCurrent" class="muted"></div><label>已准备环境<select id="environmentRef"><option value="">选择环境</option></select></label><button id="useEnvironment" class="primary" disabled>连接此环境</button><details id="manualConnection"><summary>手动连接服务</summary><div class="stack"><label>服务地址<input id="endpoint" type="url" placeholder="http://服务器地址:15732" autocomplete="off"></label><label>访问凭证<input id="apiKey" type="password" autocomplete="new-password"></label><span id="keyState" class="muted"></span><button id="saveConnection">保存连接</button></div></details><button id="checkConnection">测试当前连接</button><pre id="health" class="hidden"></pre></div></dialog>

<script>
'use strict';
/* @include connections.js */
const $=id=>document.getElementById(id), pending=new Map(), viewId=workbenchUuid();
let previewFrames=[],evaluationFrames=[];
let activeDataset='',activeModel='',workspaceSession=null;
const inFlight=new Set();
let port, sequence=0, queue=Promise.resolve(), catalog={profiles:[],datasets:[],models:[]}, jobs=[], activeJob='', uploading=false, pollBusy=false;
const connectionDirectory=createConnectionDirectory({call,onChange(){if($('connectionCurrent'))$('connectionCurrent').textContent='当前连接：'+connectionDirectory.currentLabel();controls();}});
let connectionReady=false,resourceData=null,resourceError='',resourcesLoading=false,submitting=false,selectionTouched=false,lastResourceRead=0;
const selectedGpus=new Set();
let planData=null,planError='',planLoading=false,planTimer=null,planGeneration=0,plannedKey='';
let monitorOpen=false,monitorBusy=false,monitorTimer=null,monitorGeneration=0,trainingPrepareForced=false;
let monitorGroup=0;
let monitorFrame=null,monitorSample=null,monitorPaused=false,monitorPlaying=false,monitorLastFrame='',monitorMeta=null,monitorJob='',monitorLastState='',monitorRetryAt=0,monitorHistoryExpanded=false;
const terminalStates=new Set(['succeeded','failed','cancelled','interrupted']);
function friendlyError(message){const value=String(message||'');return value.includes('policy target exceeds robot joint limits')?'模型输出超出关节限位，试跑已停止；请更换训练结果或重新训练。':value;}
const labels={queued:'排队中',running:'运行中',succeeded:'已完成',failed:'失败',cancelling:'取消中',cancelled:'已取消',interrupted:'已中断',ready:'已连接'};
function status(message,error=false){$('status').textContent=friendlyError(message);$('status').classList.toggle('quiet',message==='已连接');$('status').classList.toggle('error',error);}
function send(method,args={}){return new Promise((resolve,reject)=>{if(!port){reject(Error('工作台尚未连接'));return;}const id=String(++sequence),timer=setTimeout(()=>{pending.delete(id);reject(Error('请求超时'));},18000);pending.set(id,{resolve,reject,timer});port.postMessage({id,method,args});});}
function request(method,args={}){const run=queue.then(()=>send(method,args));queue=run.catch(()=>{});return run;}
async function call(action,args={}){const result=await request('call',{action,view_id:viewId,...args});if(result?.state==='error'||result?.error)throw Error(result.message||result.error);return result;}
function perform(fn){return async event=>{const button=event?.currentTarget;if(button?.disabled||inFlight.has(button))return;if(button){inFlight.add(button);button.disabled=true;}try{await fn();}catch(e){status(e.message,true);}finally{if(button){inFlight.delete(button);button.disabled=false;}controls();environmentView.sync();}};}
function displayTime(value){if(value==null)return null;const date=new Date(typeof value==='number'?value*1000:value);return Number.isNaN(date.valueOf())?String(value):date.toLocaleString('zh-CN',{hour12:false});}
function selectedModel(id){return catalog.models.find(m=>m.id===$(id).value);}
function options(id,items,empty='请选择'){const select=$(id),old=select.value;select.replaceChildren();const first=document.createElement('option');first.value='';first.textContent=empty;select.append(first);for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.label||item.name||item.id;select.append(option);}if(items.some(i=>i.id===old))select.value=old;else if(items.length===1)select.value=items[0].id;}
function info(id,entries){const dl=document.createElement('dl');dl.className='kv';for(const [name,value] of entries){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value==null?'—':String(value);dl.append(dt,dd);}$(id).replaceChildren(dl);}
function details(prefix,value){$(prefix+'Raw').textContent=JSON.stringify(value,null,2);$(prefix+'Details').classList.remove('hidden');}
function modelTrainingJob(model=currentModel()){return model?jobs.find(job=>job.kind==='train'&&(job.id===model.job_id||job.model_id===model.id)):null;}
function renderVersionList(){const selectedJob=modelTrainingJob();$('openTraining').disabled=!selectedJob;const list=$('actionVersions');if(!list)return;const previousScroll=list.scrollTop;list.replaceChildren();const models=matchingModels();for(const job of jobs.filter(item=>item.kind==='train'&&(item.dataset_id||item.config?.dataset_id)===activeDataset&&(!terminalStates.has(item.state)||(item.model_id&&!models.some(model=>model.id===item.model_id))))){const button=document.createElement('button');button.className='version-row';button.textContent='新版本 · '+(labels[job.state]||job.state);button.onclick=()=>{activeJob=job.id;trainingPrepareForced=false;showTab('training');inspectJob().catch(error=>status(error.message,true));};list.append(button);}for(const model of models){const button=document.createElement('button');button.className='version-row'+(model.id===activeModel?' selected':'');const title=document.createElement('strong'),meta=document.createElement('small');title.textContent=modelLabel(model,false);meta.textContent=model.qualification==='evaluated'?'已评估':'训练完成 · 未评估';button.append(title,meta);button.onclick=()=>{activeModel=model.id;syncMotionSelection();};list.append(button);}if(!models.length){const empty=document.createElement('span');empty.className='muted';empty.textContent='还没有训练版本';list.append(empty);}const selectionKey=activeModel+':'+models.map(model=>model.id).join(',');if(list.clientHeight&&list.dataset.selectionKey!==selectionKey){list.dataset.selectionKey=selectionKey;const selected=list.querySelector('.selected');if(selected)list.scrollTop+=selected.getBoundingClientRect().top-list.getBoundingClientRect().top-6;}else list.scrollTop=previousScroll;$('breadcrumbName').textContent=currentDataset()?.name||'';}
function trainingHeartbeat(job,result){if(terminalStates.has(job?.state)){const ended=job.finished_at||job.completed_at||job.ended_at;return ended?'结束于 '+displayTime(ended):'训练已结束';}const progress=job?.progress||{},heartbeat=Number(progress.updated_at),age=Number.isFinite(heartbeat)?Math.max(0,Date.now()/1000-heartbeat):null;if(age!==null&&age>20)return `${Math.floor(age)} 秒未收到训练心跳`;if(['world_model','policy','training'].includes(progress.phase)){const updates=progress.phase==='world_model'?progress.world_model_updates:progress.policy_updates;return '学习更新中'+(Number.isInteger(updates)?' · 第 '+updates+' 次':'')+(age!==null?' · 心跳 '+Math.floor(age)+' 秒前':'');}return age!==null?'心跳 '+Math.floor(age)+' 秒前':Number.isFinite(result.age_s)?`画面采样 ${Math.max(0,result.age_s).toFixed(1)} 秒前`:'';}
function renderDataset(data){const entries=[['动作',data.name||data.id],['机器人配置',catalog.profiles.find(p=>p.id===data.profile_id)?.label||data.profile_id]];if(Number.isFinite(data.frames))entries.push(['帧数',data.frames]);if(Number.isFinite(data.fps))entries.push(['采样率',`${data.fps} Hz`]);if(Number.isFinite(data.duration_s))entries.push(['时长',`${data.duration_s.toFixed(2)} s`]);info('datasetInfo',entries);$('datasetInfo').classList.remove('hidden');details('dataset',data);}
function renderEvaluation(report,job){const entries=[['任务状态',labels[job.state]||job.state||'—']];if(report&&typeof report==='object'){const rmse=report.joint_rmse_rad??report.joint_rmse;if(Number.isFinite(rmse))entries.push(['关节 RMSE(rad)',rmse.toFixed(5)]);for(const [key,label] of [['early_terminations','提前终止'],['timeouts','超时'],['steps','评测步数']])if(Number.isFinite(report[key]))entries.push([label,report[key]]);if(typeof report.onnx_checked==='boolean')entries.push(['ONNX 校验',report.onnx_checked?'已校验':'未校验']);if(Number.isFinite(report.onnx_max_abs_error))entries.push(['ONNX 最大误差',report.onnx_max_abs_error.toPrecision(5)]);if(report.qualification)entries.push(['评测状态',report.qualification==='evaluated'?'已评测':report.qualification==='unverified'?'未评测':report.qualification]);details('eval',report);}else{$('evalDetails').classList.add('hidden');}if(job.error||job.message)entries.push(['任务信息',job.error||job.message]);info('evalResult',entries);}
function renderPackage(result){const entries=[];if(result.package_id)entries.push(['包 ID',result.package_id]);if(Number.isFinite(result.size)){const size=result.size;entries.push(['大小',size<1024?`${size} B`:size<1048576?`${(size/1024).toFixed(1)} KiB`:`${(size/1048576).toFixed(1)} MiB`]);}const manifest=result.manifest||{},files=Object.keys(manifest.files||{});if(files.length)entries.push(['文件',files.join('、')]);if(manifest.qualification)entries.push(['评测状态',manifest.qualification==='evaluated'?'已评测':manifest.qualification==='unverified'?'未评测':manifest.qualification]);info('exportResult',entries);details('export',result);}
function listEmpty(id,message){const node=document.createElement('div');node.className='empty';node.textContent=message;$(id).replaceChildren(node);}
function profileInfo(){const p=catalog.profiles.find(p=>p.id===$('profile').value);if(!p){$('profileInfo').textContent='未选择机器人';return;}info('profileInfo',[['型号',p.label||p.robot_type||p.id],['自由度',p.joint_names?.length],['控制频率',p.control_hz?`${p.control_hz} Hz`:null],['模型版本',p.model_version]]);}
function compatibleDatasets(profileId){return catalog.datasets.filter(d=>!profileId||d.profile_id===profileId);}
function updateTrainDatasets(){options('trainDataset',compatibleDatasets($('trainProfile').value),'选择动作数据');controls();}

async function useJobModel(id){let model=catalog.models.find(item=>item.id===id);if(!model){let latest;try{latest=await call('catalog');}catch(error){connectionReady=false;controls();throw error;}catalog={...latest,profiles:latest.profiles||[],datasets:latest.datasets||[],models:latest.models||[]};for(const [target,key,placeholder] of [['profile','profiles','选择机器人配置'],['trainProfile','profiles','选择机器人配置'],['evalModel','models','选择模型'],['exportModel','models','选择模型']])options(target,catalog[key],placeholder);model=catalog.models.find(item=>item.id===id);}if(!model)throw Error('模型暂不可用，请刷新任务后重试');const dataset=catalog.datasets.find(item=>item.id===model.dataset_id);if(!matchingModels(dataset).some(item=>item.id===id))throw Error('模型与参考动作不匹配');selectMotion(model.dataset_id);activeModel=id;syncMotionSelection();return model;}

function viewportSize(box,moving=false){const width=Math.max(160,box.width||640),height=Math.max(120,box.height||360),scale=Math.min(moving?1:1.5,(moving?640:960)/width,(moving?480:640)/height);return {width:Math.max(160,Math.round(width*scale)),height:Math.max(120,Math.round(height*scale))};}
const referenceView=(()=>{
 let dataset=null,camera=null,frame=0,playing=false,busy=false,timer=null,epoch=0,pending=false,active=true,lastStart=0,drag=null,playStarted=0,playFrame=0,retryAt=0;
 const visible=()=>active&&!document.hidden&&!!dataset;
 function controls(){const enabled=!!dataset;$('referencePlay').disabled=!enabled;$('referenceFrame').disabled=!enabled;$('referencePlay').textContent=playing?'暂停参考动作':'播放参考动作';}
 function stop(){playing=false;controls();}
 function schedule(delay=0){pending=true;clearTimeout(timer);if(!visible()||busy)return;timer=setTimeout(render,Math.max(delay,200-(performance.now()-lastStart),retryAt-performance.now()));}
 async function render(){if(!visible()||busy)return;busy=true;pending=false;lastStart=performance.now();const token=epoch,id=dataset.id;try{if(playing){const fps=Number(dataset.fps)||30;frame=Math.min(Math.max(0,(dataset.frames||1)-1),playFrame+Math.floor((performance.now()-playStarted)*fps/1000));}const box=$('datasetPreview').getBoundingClientRect(),dimensions=viewportSize(box,!!(playing||drag));const args={dataset_id:id,offset:frame,...dimensions,jpeg_quality:playing||drag?70:88,...(camera?{azimuth:camera.azimuth,elevation:camera.elevation,distance:camera.distance}:{})};const result=await call('inspect',{mode:'dataset_render',...args});if(token!==epoch||dataset?.id!==id)return;const image=result.image;if(!result.available||image?.mime!=='image/jpeg'||typeof image.data!=='string'||image.data.length>3000000)throw Error(result.reason||'参考动作画面不可用');const decoded=new Image();decoded.src='data:image/jpeg;base64,'+image.data;await decoded.decode();if(token!==epoch||dataset?.id!==id)return;if(decoded.naturalWidth!==image.width||decoded.naturalHeight!==image.height)throw Error('参考动作画面尺寸不一致');if(!camera&&result.camera)camera={...result.camera,lookat:[...result.camera.lookat]};dataset={...dataset,frames:result.frames,fps:result.fps};frame=result.frame_index;$('referenceImage').src=decoded.src;$('referenceImage').classList.remove('hidden');if($('environmentAsset')){$('environmentAsset').src=decoded.src;$('environmentAsset').classList.remove('hidden');$('environmentAssetPlaceholder').classList.add('hidden');}if(!$('modelDetails').classList.contains('hidden')){$('modelReferenceImage').src=decoded.src;$('modelReferenceImage').classList.remove('hidden');}$('referenceState').classList.add('hidden');$('referenceFrame').max=Math.max(0,result.frames-1);$('referenceFrame').value=result.frame_index;$('referenceTime').textContent=`${Number(result.time).toFixed(2)} / ${Number(result.duration_s).toFixed(2)} s`;retryAt=0;if(frame>=result.frames-1)stop();}catch(error){if(token===epoch){stop();retryAt=performance.now()+2000;$('referenceImage').classList.add('hidden');$('referenceState').textContent=error.message;$('referenceState').classList.remove('hidden');}}finally{busy=false;controls();if(playing||pending)schedule();}}
 $('referencePlay').onclick=()=>{if(!dataset)return;if(playing){stop();schedule();return;}if(frame>=dataset.frames-1)frame=0;playFrame=frame;playStarted=performance.now();playing=true;retryAt=0;controls();schedule();};
 $('referenceFrame').oninput=()=>{stop();epoch++;frame=Number($('referenceFrame').value);retryAt=0;schedule();};
 const gesture=$('referenceGesture');gesture.onpointerdown=event=>{if(!camera)return;drag={x:event.clientX,y:event.clientY,azimuth:camera.azimuth,elevation:camera.elevation};gesture.setPointerCapture(event.pointerId);};gesture.onpointermove=event=>{if(!drag||!camera)return;camera.azimuth=(drag.azimuth+(event.clientX-drag.x)*.3+360)%360;camera.elevation=Math.max(-85,Math.min(85,drag.elevation+(event.clientY-drag.y)*.3));schedule();};gesture.onpointerup=gesture.onpointercancel=()=>{drag=null;schedule();};gesture.addEventListener('wheel',event=>{event.preventDefault();if(!camera)return;camera.distance=Math.max(.5,Math.min(12,camera.distance*Math.exp(event.deltaY*.001)));schedule();},{passive:false});
 document.addEventListener('visibilitychange',()=>{epoch++;clearTimeout(timer);if(document.hidden)stop();else if(visible())schedule();});
 let referenceSize='';new ResizeObserver(()=>{const box=$('datasetPreview').getBoundingClientRect(),size=Math.round(box.width)+'x'+Math.round(box.height);if(size!==referenceSize&&box.width&&box.height){referenceSize=size;camera=null;epoch++;schedule();}}).observe($('datasetPreview'));
 return {resize(){camera=null;epoch++;if(dataset)schedule();},select(value){epoch++;clearTimeout(timer);stop();dataset=value;camera=null;frame=0;retryAt=0;$('referenceImage').classList.add('hidden');$('referenceState').textContent=value?'正在加载参考动作':'选择动作';$('referenceState').classList.remove('hidden');$('referenceTime').textContent='';$('referenceFrame').value=0;controls();if(value)schedule();},visible(value){active=value;epoch++;clearTimeout(timer);if(!value)stop();else if(dataset)schedule();}};
})();

const environmentView=(()=>{
 let available=false,targets=[],job=null,cursor=0,timer=null,busy=false,generation=0,logs=[];
 const stages={preparing:'准备环境与机器人资源',preparing_base:'准备基础运行环境',starting_service:'启动训练服务',verifying_gpu:'验证 GPU 计算',complete:'准备完成',queued:'等待开始',checking:'检查服务器',connecting:'连接服务器',installing:'安装环境',verifying:'验证环境',ready:'环境就绪',succeeded:'环境就绪',failed:'准备失败',cancelled:'已取消',starting:'启动服务',pulling:'拉取运行环境',building:'准备运行环境'};
 const target=()=>targets.find(item=>item.id===$('environmentTarget').value);
 function render(){const active=job&&['queued','running'].includes(job.state),item=target(),caps=item?.capabilities||{};$('environmentConnection').textContent=connectionReady?'当前连接：'+connectionDirectory.currentLabel():'尚未连接';$('environmentTask').classList.toggle('hidden',!job);$('environmentTask').textContent=job?[(item?.label||job.target_id||'环境'),job.mode==='isolated'?'独立环境':job.mode==='reuse'?'已有环境':'检查',labels[job.state]||job.state].join(' · '):'环境任务';$('environmentContinue').classList.toggle('hidden',!connectionReady);$('environmentTargetLabel').classList.toggle('hidden',!available);$('environmentAdvanced').classList.toggle('hidden',!available||!item);$('environmentTarget').disabled=!!active||busy;$('environmentCancel').classList.toggle('hidden',!active);$('environmentCancel').disabled=busy;$('environmentState').textContent=job?labels[job.state]||job.state:'';$('environmentStage').textContent=job?stages[job.stage]||job.stage||'':'';$('environmentMessage').textContent=job?.error||'';$('environmentSummary').textContent=item?[item.label,item.host,job?.mode==='isolated'?'独立环境':job?.mode==='reuse'?'已有环境':''].filter(Boolean).join(' · '):available?'没有已登记的服务器':connectionReady?'使用当前服务':'请先设置服务连接';$('environmentChecks').replaceChildren();for(const check of job?.checks||[]){const row=document.createElement('div'),line=document.createElement('div'),name=document.createElement('span'),state=document.createElement('span');row.dataset.state=check.state;line.className='check-row';name.textContent={docker:'容器服务',platform:'系统兼容性',gpu_runtime:'GPU 可用性',gpus:'GPU 资源',workspace_disk:'磁盘空间',existing_service:'已有环境'}[check.name]||check.name;state.textContent={passed:'已通过',warning:'需注意',failed:'未通过'}[check.state]||check.state;line.append(name,state);row.append(line);if(check.detail){const detail=document.createElement('div');detail.className='check-detail';detail.textContent=check.detail;row.append(detail);}$('environmentChecks').append(row);}$('environmentLog').textContent=logs.join('\n');renderStepper();const primary=$('environmentPrimary');primary.disabled=busy||!!active||(available&&!item);primary.textContent=!available?(connectionReady?'进入工作台':'设置连接'):active?'正在准备':job?.action==='install'&&job.state==='succeeded'?'连接此环境':job?.action==='check'&&job.state==='succeeded'?(caps.reuse?'接入已有环境':'安装并继续'):job&&['failed','cancelled','interrupted'].includes(job.state)?'重新检查':'连接并检查';$('environmentMode').querySelector('[value="reuse"]').disabled=!caps.reuse;$('environmentMode').querySelector('[value="isolated"]').disabled=!caps.isolated;$('environmentInstall').disabled=busy||!!active||!item||(!caps.reuse&&!caps.isolated)||(job?.action==='check'&&job.state==='failed');}
 function renderStepper(){let list=$('environmentStepper');if(!list){list=document.createElement('ol');list.id='environmentStepper';$('environmentStage').after(list);const checks=document.createElement('details'),title=document.createElement('summary');title.textContent='检查明细';checks.className='environment-check-details';$('environmentChecks').before(checks);checks.append(title,$('environmentChecks'));}const checking=job?.action==='check',names=checking?['连接服务器','检查硬件与权限']:['连接服务器','检查硬件与权限','准备训练与仿真服务','验证 GPU 与仿真画面'];let current=!job?-1:['queued','starting','connecting'].includes(job.stage)?0:job.stage==='checking'?1:['preparing','preparing_base','building','starting_service','installing','pulling'].includes(job.stage)?2:['verifying','verifying_gpu'].includes(job.stage)?3:job.state==='succeeded'?names.length:1;if(checking)current=Math.min(1,current);list.replaceChildren(...names.map((name,index)=>{const node=document.createElement('li');node.textContent=name;node.dataset.state=job?.state==='succeeded'||index<current?'passed':index===current?(['failed','cancelled','interrupted'].includes(job?.state)?'failed':'active'):'pending';return node;}));}
 function schedule(){clearTimeout(timer);if(job&&['queued','running'].includes(job.state)&&!document.hidden&&!$('environment').classList.contains('hidden'))timer=setTimeout(()=>poll().catch(error=>{$('environmentMessage').textContent=error.message;}),2000);}
 async function poll(){if(!job||busy)return;const id=job.id,epoch=generation;busy=true;try{const result=await call('inspect',{mode:'env_status',job_id:id,cursor});if(epoch!==generation||job?.id!==id)return;job=result.job||job;cursor=Number.isInteger(result.next_cursor)?result.next_cursor:cursor;for(const event of result.events||[]){if(typeof event.message==='string')logs.push(event.message);}if(logs.length>250)logs=logs.slice(-250);}finally{busy=false;render();schedule();}}

 async function load(){if(!available){render();return;}const result=await call('env_targets');targets=Array.isArray(result.targets)?result.targets:[];await connectionDirectory.load();options('environmentTarget',targets,'选择服务器');if(!$('environmentTarget').value&&targets.length)$('environmentTarget').value=targets[0].id;const item=target();$('environmentMode').value=item?.capabilities?.reuse?'reuse':'isolated';await adopt(item?.latest_job||null);}

 $('environmentCancel').onclick=perform(async()=>{if(!job)return;const result=await call('env_cancel',{job_id:job.id});job=result.job||result;await poll();});$('environmentContinue').onclick=()=>showTab('data');

})();

window.addEventListener('message',async event=>{if(event.source!==parent||event.data?.protocol!=='motus.workbench/1'||!event.ports?.[0]||port)return;port=event.ports[0];port.onmessage=event=>{const p=pending.get(event.data?.id);if(!p)return;clearTimeout(p.timer);pending.delete(event.data.id);event.data.error?p.reject(Error(event.data.error)):p.resolve(event.data.result);};try{const state=await call('info');connectionDirectory.setValues(state.config_values||{});if(state.environment_available)connectionDirectory.load().catch(()=>{});if(state.config_values?.endpoint)$('endpoint').value=state.config_values.endpoint;environmentView.initialize(state);if(state.state==='unconfigured'){status(state.message||'先准备运行环境');await environmentView.open();return;}await refresh();if(state.session_id)await simulator.restore(state.session_id);status('已连接');}catch(e){status(e.message,true);}finally{controls();}});
setInterval(async()=>{if(!port||!connectionReady||pollBusy||uploading||submitting||document.hidden)return;const active=jobs.some(j=>['queued','running','cancelling'].includes(j.state)),resourcesDue=!$('training').classList.contains('hidden')&&Date.now()-lastResourceRead>10000&&!resourcesLoading;if(!active&&!resourcesDue)return;pollBusy=true;try{if(active)await refreshJobs();if(active&&!jobs.some(j=>['queued','running','cancelling'].includes(j.state)))await refresh();else if(resourcesDue)await refreshResources();}catch(e){status(e.message,true);}finally{pollBusy=false;}},3000);
